        const bodies = new THREE.InstancedMesh(bodyGeometry, bodyMaterial, carCount);
        const roofs = new THREE.InstancedMesh(roofGeometry, roofMaterial, carCount);
        const headlights = new THREE.InstancedMesh(lightGeometry, materials.carHeadlight, carCount * 2);
        bodies.castShadow = false;
        roofs.castShadow = false;
        bodies.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        roofs.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        headlights.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        const colors = [0x68878b, 0x8d7770, 0x9ca09a, 0xd4b182, 0x6e7f90, 0xb2a895, 0x718b82, 0x8b7c83];
        for (let i = 0; i < carCount; i++) {
          bodies.setColorAt(i, new THREE.Color(colors[i]));
          roofs.setColorAt(i, new THREE.Color(colors[(i + 2) % colors.length]).lerp(new THREE.Color(0xf3eee4), 0.38));
        }
        const lanes = [
          { cx: 0, cz: -3.32, w: 7.82, d: 0.16, phase: 0.03 },
          { cx: 0, cz: -3.15, w: 7.72, d: 0.16, phase: 0.56 }
        ];
        const cars = [];
        for (let i = 0; i < carCount; i++) {
          const lane = lanes[i < 4 ? 0 : 1];
          cars.push({
            lane,
            t: (i % 4) / 4 + lane.phase,
            direction: i % 2 === 0 ? 1 : -1,
            speed: 0.012 + (i % 3) * 0.0017
          });
        }
        root.add(bodies, roofs, headlights);
        carSystem = { bodies, roofs, headlights, cars, dummy: new THREE.Object3D() };
      }

      function makePedestrians() {
        const count = 14;
        const bodyMaterial = new THREE.MeshToonMaterial({ color: 0xffffff, gradientMap: toonGradient });
        const headMaterial = new THREE.MeshToonMaterial({ color: 0xffffff, gradientMap: toonGradient });
        const bodyGeometry = new THREE.CapsuleGeometry(0.023, 0.105, 3, 5);
        const headGeometry = new THREE.IcosahedronGeometry(0.028, 1);
        const bodies = new THREE.InstancedMesh(bodyGeometry, bodyMaterial, count);
        const heads = new THREE.InstancedMesh(headGeometry, headMaterial, count);
        bodies.castShadow = false;
        heads.castShadow = false;
        bodies.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        heads.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        const shirtColors = [0xb06f76, 0x4f7f7e, 0xd0a46f, 0x627f99, 0x917a89, 0x718d72, 0xc4b48f];
        const skinColors = [0xd8b499, 0xc38f75, 0xe0c0a6, 0xb47e69];
        const people = [];
        for (let i = 0; i < count; i++) {
          bodies.setColorAt(i, new THREE.Color(shirtColors[i % shirtColors.length]));
          heads.setColorAt(i, new THREE.Color(skinColors[i % skinColors.length]));
          const plaza = i >= 10;
          people.push({
            baseX: plaza ? 3.55 + (i - 10) * 0.34 : -4.2 + i * 0.66,
            baseZ: plaza ? 2.57 + ((i - 10) % 2) * 0.32 : 1.5,
            phase: range(0, Math.PI * 2),
            amplitude: range(0.18, 0.52),
            speed: range(0.04, 0.095),
            pause: range(0.1, 0.55),
            scale: range(0.82, 1.12)
          });
        }
        root.add(bodies, heads);
        pedestrianSystem = { bodies, heads, people, dummy: new THREE.Object3D() };
      }

      function makeParticles() {
        const count = 150;
        const geometry = new THREE.PlaneGeometry(0.075, 0.105);
        const colorBuffer = new Float32Array(count * 3);
        const alphaBuffer = new Float32Array(count);
        geometry.setAttribute("aColor", new THREE.InstancedBufferAttribute(colorBuffer, 3));
        geometry.setAttribute("aAlpha", new THREE.InstancedBufferAttribute(alphaBuffer, 1));
        const material = new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide,
          vertexColors: false,
          uniforms: {},
          vertexShader: `
            attribute vec3 aColor;
            attribute float aAlpha;
            varying vec3 vColor;
            varying float vAlpha;
            void main() {
              vColor = aColor;
              vAlpha = aAlpha;
              vec4 world = modelMatrix * instanceMatrix * vec4(position, 1.0);
              gl_Position = projectionMatrix * viewMatrix * world;
            }
          `,
          fragmentShader: `
            varying vec3 vColor;
            varying float vAlpha;
            void main() {
              gl_FragColor = vec4(vColor, vAlpha);
            }
          `
        });
        const mesh = new THREE.InstancedMesh(geometry, material, count);
        mesh.frustumCulled = false;
        mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        const particles = [];
        for (let i = 0; i < count; i++) {
          particles.push({
            x: 0, y: 0, z: 0, speed: 0, sway: 0, phase: 0,
            rotation: new THREE.Euler(), spin: new THREE.Vector3(),
            resting: false, rest: 0, alpha: 0
          });
        }
        root.add(mesh);
        particleSystem = {
          mesh,
          geometry,
          colorBuffer,
          alphaBuffer,
          particles,
          dummy: new THREE.Object3D(),
          season: "spring",
          tick: 0
        };
        resetParticles("spring");
      }

      function resetParticles(season) {
        const data = SEASONS[season];
        particleSystem.season = season;
        particleSystem.mesh.visible = season !== "summer" && !REDUCED_MOTION.matches;
        const colors = season === "spring"
          ? [0xf2c6d0, 0xe6a9ba, 0xf6d9df]
          : season === "autumn"
            ? [0xd29a54, 0xba703f, 0xe2b468]
            : [0xf5f4ee, 0xe6edef, 0xffffff];
        for (let i = 0; i < particleSystem.particles.length; i++) {
          const p = particleSystem.particles[i];
          respawnParticle(p, true);
          const color = new THREE.Color(colors[i % colors.length]);
          particleSystem.colorBuffer[i * 3] = color.r;
          particleSystem.colorBuffer[i * 3 + 1] = color.g;
          particleSystem.colorBuffer[i * 3 + 2] = color.b;
          particleSystem.alphaBuffer[i] = p.alpha;
        }
        particleSystem.geometry.attributes.aColor.needsUpdate = true;
        particleSystem.geometry.attributes.aAlpha.needsUpdate = true;
      }

      function respawnParticle(p, initial = false) {
        p.x = range(-4.5, 4.5);
        if (Math.abs(p.x) < 4.4) {
          p.z = rand() < 0.5 ? range(-3.25, -1.55) : range(1.58, 3.25);
        } else {
          p.z = range(-3.3, 3.3);
        }
        p.y = initial ? range(0.55, 4.1) : range(3.6, 4.6);
        p.speed = particleSystem?.season === "autumn" ? range(0.24, 0.4) : particleSystem?.season === "winter" ? range(0.17, 0.3) : range(0.12, 0.23);
        p.sway = range(0.045, 0.14);
        p.phase = range(0, Math.PI * 2);
        p.rotation.set(range(0, Math.PI), range(0, Math.PI), range(0, Math.PI));
        p.spin.set(range(-1.2, 1.2), range(-1.4, 1.4), range(-1, 1));
        p.resting = false;
        p.rest = 0;
        p.alpha = 0.75;
      }

      function makeHighlight() {
        ring = new THREE.Mesh(
          new THREE.RingGeometry(0.33, 0.47, 40),
          new THREE.MeshBasicMaterial({
            color: 0xf4d7a0,
            transparent: true,
            opacity: 0.7,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide
          })
        );
        ring.rotation.x = -Math.PI / 2;
        ring.visible = false;
        root.add(ring);
        ringGlow = new THREE.Mesh(
          new THREE.RingGeometry(0.51, 0.56, 40),
          new THREE.MeshBasicMaterial({
            color: 0xffe8bf,
            transparent: true,
            opacity: 0.2,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide
          })
        );
        ringGlow.rotation.x = -Math.PI / 2;
        ringGlow.visible = false;
        root.add(ringGlow);
      }

      function addLandmarkHitAreas() {
        interactiveObjects.push(waterMesh, boatGroupA, boatGroupB);
        interactiveObjects.push(pearlBase, shanghaiBase, bundClockBase, beaconBase);
      }

      function flushWindowInstances() {
        const geometry = new THREE.PlaneGeometry(1, 1);
        const darkMesh = new THREE.InstancedMesh(geometry, materials.windowDark, windowDarkMatrices.length);
        const litMesh = new THREE.InstancedMesh(geometry, materials.windowLit, windowLitMatrices.length);
        fillInstanceMatrices(darkMesh, windowDarkMatrices);
        fillInstanceMatrices(litMesh, windowLitMatrices);
        tintLitWindows(litMesh, windowLitMatrices.length);
        darkMesh.frustumCulled = false;
        litMesh.frustumCulled = false;
        root.add(darkMesh, litMesh);

        const bundShape = new THREE.Shape();
        bundShape.moveTo(-0.045, -0.085);
        bundShape.lineTo(0.045, -0.085);
        bundShape.lineTo(0.045, 0.01);
        bundShape.absarc(0, 0.012, 0.045, 0, Math.PI, false);
        bundShape.lineTo(-0.045, -0.085);
        const bundGeo = new THREE.ShapeGeometry(bundShape, 8);
        const bundFrame = new THREE.InstancedMesh(bundGeo, materials.bundTrim, bundWindowFrameMatrices.length);
        const bundDark = new THREE.InstancedMesh(bundGeo, materials.bundWindowDark, bundWindowDarkMatrices.length);
        const bundLit = new THREE.InstancedMesh(bundGeo, materials.bundWindowLit, bundWindowLitMatrices.length);
        fillInstanceMatrices(bundFrame, bundWindowFrameMatrices);
        fillInstanceMatrices(bundDark, bundWindowDarkMatrices);
        fillInstanceMatrices(bundLit, bundWindowLitMatrices);
        tintLitWindows(bundLit, bundWindowLitMatrices.length);
        bundFrame.frustumCulled = false;
        bundDark.frustumCulled = false;
        bundLit.frustumCulled = false;
        root.add(bundFrame, bundDark, bundLit);

        const pilasters = new THREE.InstancedMesh(
          new THREE.BoxGeometry(1, 1, 1),
          materials.bundTrim,
          bundPilasterMatrices.length
        );
        fillInstanceMatrices(pilasters, bundPilasterMatrices);
        pilasters.frustumCulled = false;
        root.add(pilasters);
      }

      function fillInstanceMatrices(mesh, data) {
        const matrix = new THREE.Matrix4();
        for (let i = 0; i < data.length; i++) {
          const item = data[i];
          matrix.compose(item.position, item.quaternion, item.scale);
          mesh.setMatrixAt(i, matrix);
        }
        mesh.instanceMatrix.needsUpdate = true;
      }

      function tintLitWindows(mesh, count) {
        if (!count) return;
        const warm = new THREE.Color(1, 1, 1);
        const warmBright = new THREE.Color(1, 0.94, 0.78);
        const cool = new THREE.Color(0.72, 0.84, 1);
        for (let i = 0; i < count; i++) {
          const roll = rand();
          mesh.setColorAt(i, roll < 0.6 ? warm : roll < 0.82 ? warmBright : cool);
        }
        if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      }

      function bindUI() {
        flushWindowInstances();
        for (let i = 0; i < STOP_DATA.length; i++) {
          const dot = document.createElement("button");
          dot.type = "button";
          dot.className = "progress-dot";
          dot.dataset.stop = String(i);
          dot.setAttribute("aria-label", `Stop ${i + 1}`);
          dot.addEventListener("click", () => setStop(i));
          $("#tour-dots").append(dot);
        }

        $("#next-button").addEventListener("click", () => setStop((state.stop + 1) % 7));
        $("#prev-button").addEventListener("click", () => {
          if (state.stop > 0) setStop(state.stop - 1);
        });
        $("#auto-button").addEventListener("click", () => setAuto(!state.auto));
        $("#reset-button").addEventListener("click", () => {
          setStop(0);
          controls.target.set(0, 0.78, 0);
        });
        const timeSlider = $("#time-slider");
        timeSlider.addEventListener("pointerdown", () => {
          state.scrubbing = true;
          state.timeTween = null;
          ensureAudioContext();
        });
        timeSlider.addEventListener("input", (event) => {
          ensureAudioContext();
          setHour(Number(event.currentTarget.value), { instant: true });
        });
        for (const eventName of ["pointerup", "pointercancel", "change", "blur"]) {
          timeSlider.addEventListener(eventName, () => {
            state.scrubbing = false;
          });
        }
        document.querySelectorAll(".preset-button").forEach((button) => {
          button.addEventListener("click", () => {
            ensureAudioContext();
            setHour(Number(button.dataset.hour));
          });
        });
        document.querySelectorAll(".season-button").forEach((button) => {
          button.addEventListener("click", () => {
            ensureAudioContext();
            applySeason(button.dataset.season);
          });
        });
        $("#sound-button").addEventListener("click", () => {
          state.sound = !state.sound;
          $("#sound-button").setAttribute("aria-pressed", String(state.sound));
          if (state.sound) {
            ensureAudioContext();
            playChime();
          }
        });

        $("#panel-toggle").addEventListener("click", () => setPanel(true));
        $("#panel-close").addEventListener("click", () => setPanel(false));

        document.addEventListener("keydown", handleKeys);
        canvas.addEventListener("pointerdown", onPointerDown);
        canvas.addEventListener("pointermove", onPointerMove);
        canvas.addEventListener("pointerup", onPointerUp);
        canvas.addEventListener("pointercancel", onPointerUp);
        canvas.addEventListener("pointerleave", () => {
          if (!state.isDragging) canvas.classList.remove("is-hovering");
        });
        controls.addEventListener("start", () => {
          state.userControlling = true;
          state.hold = null;
        });
        controls.addEventListener("end", () => {
          state.userControlling = false;
        });
      }

      function setPanel(open) {
        $("#side-panel").classList.toggle("is-open", open);
        $("#panel-toggle").setAttribute("aria-expanded", String(open));
      }

      function handleKeys(event) {
        if (event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.key === "ArrowRight" || event.code === "Space") {
          event.preventDefault();
          setStop((state.stop + 1) % 7);
        } else if (event.key === "ArrowLeft") {
          event.preventDefault();
          if (state.stop > 0) setStop(state.stop - 1);
        } else if (event.key.toLowerCase() === "t") {
          event.preventDefault();
          cycleTimePreset();
        } else if (["1", "2", "3", "4"].includes(event.key)) {
          event.preventDefault();
          applySeason(["spring", "summer", "autumn", "winter"][Number(event.key) - 1]);
        }
      }

      function cycleTimePreset() {
        const presets = [6.5, 12, 18.5, 20.5];
        const next = presets.find((value) => value > state.hour + 0.12) ?? presets[0];
        setHour(next);
      }

      function setHour(value, options = {}) {
        const target = clamp(Number(value), 0, 24);
        if (!Number.isFinite(target)) return;
        if (options.instant || !options.animate && Math.abs(target - state.hour) < 0.001) {
          state.hour = target;
          state.timeTween = null;
          applyTime(target);
          return;
        }
        state.timeTween = { from: state.hour, to: target, start: performance.now(), duration: 2000 };
        updateTimeButtons(target);
      }

      function applyTime(hour, force = false) {
        if (force) renderer.shadowMap.needsUpdate = true;
        const dayElevation = Math.sin((hour - 6) / 12 * Math.PI);
        const day = clamp(dayElevation, 0, 1);
        const night = getNightFactor(hour);
        const dawn = smoothstep(5.1, 7.1, hour) * (1 - smoothstep(8, 10, hour));
        const dusk = smoothstep(16.4, 18.6, hour) * (1 - smoothstep(19.3, 21, hour));
        const sunWarmth = clamp(dawn * 1.1 + dusk * 1.15, 0, 1);
        const sunColor = new THREE.Color(0xfff4dc).lerp(new THREE.Color(0xffb36e), sunWarmth);
        const solarAngle = (hour - 6) / 12 * Math.PI;
        const solarY = Math.max(dayElevation, -0.16);
        sun.position.set(-0.9 * Math.cos(solarAngle), solarY * 8.2, -6.6 * Math.cos(solarAngle));
        sun.color.copy(sunColor);
        sun.intensity = 0.08 + day * 2.25;
        hemisphere.intensity = 0.88 + day * 0.58;
        hemisphere.color.copy(new THREE.Color(0xc9dcdd).lerp(new THREE.Color(0xffdbad), sunWarmth));
        hemisphere.groundColor.copy(new THREE.Color(0x726d63).lerp(new THREE.Color(0x5a6570), night * 0.62));
        renderer.toneMappingExposure = 1.14 - night * 0.12;
        warmFill.intensity = 0.12 + day * 0.44;
        coolFill.intensity = 0.07 + day * 0.25;

        const colors = [
          [0, 0x6f828d, 0xa8b0ac, 0xd8d7ca],
          [5.4, 0xa7adb0, 0xded5c5, 0xf2e7d7],
          [6.5, 0xf0c3a7, 0xe3d8be, 0xf7ecdb],
          [12, 0xc4d7d5, 0xe8e8dc, 0xf5eee3],
          [17.5, 0xd8c9b3, 0xe9ddca, 0xf4e4d0],
          [18.5, 0xeab08e, 0xe3c7a6, 0xf1dfcb],
          [20.5, 0x778892, 0x9fa8a6, 0xcfd1c7],
          [24, 0x6f828d, 0xa8b0ac, 0xd8d7ca]
        ];
        const sky = sampleSky(colors, hour);
        const seasonTint = new THREE.Color(SEASONS[state.season].wash.replace(/rgba?\(([^)]+)\)/, (_, values) => "#" + values.split(",").slice(0, 3).map((n) => Number(n).toString(16).padStart(2, "0")).join("")));
        const top = new THREE.Color(sky[0]).lerp(seasonTint, 0.028);
        const mid = new THREE.Color(sky[1]).lerp(seasonTint, 0.018);
        const bottom = new THREE.Color(sky[2]).lerp(seasonTint, 0.012);
        document.documentElement.style.setProperty("--sky-top", `#${top.getHexString()}`);
        document.documentElement.style.setProperty("--sky-mid", `#${mid.getHexString()}`);
        document.documentElement.style.setProperty("--sky-bottom", `#${bottom.getHexString()}`);
        scene.fog.color.copy(bottom);

        materials.water.color.copy(new THREE.Color(0x60918e).lerp(new THREE.Color(0x385f6d), night * 0.54));
        materials.farGround.color.copy(new THREE.Color(SEASONS[state.season].lawn).lerp(new THREE.Color(0x647d7d), night * 0.24));
        materials.nearGround.color.copy(new THREE.Color(0xd8c7ab).lerp(new THREE.Color(0x8e897c), night * 0.26));
        materials.lampGlow.opacity = 0.09 + night * 0.88;
        for (const material of lampGlowMaterials) material.opacity = 0.045 + night * 0.34;
        materials.windowLit.opacity = night * 0.97;
        materials.bundWindowLit.opacity = night * 0.97;
        materials.boatWindow.opacity = 0.3 + night * 0.85;
        materials.boatWindowCool.opacity = 0.26 + night * 0.72;
        materials.carHeadlight.opacity = night * 0.92;
        materials.beaconGlow.opacity = 0.18 + night * 0.8;
        for (const reflection of waterReflections) {
          reflection.material.opacity = night * 0.4;
        }
        for (const light of featureLights) {
          if (light.mode === "basic") light.material.opacity = light.max * night;
          else if (light.material.emissiveIntensity !== undefined) {
            light.material.emissiveIntensity = 0.04 + light.max * night;
          }
        }
        const rounded = Math.round(hour * 60) % 1440;
        const timeString = `${String(Math.floor(rounded / 60)).padStart(2, "0")}:${String(rounded % 60).padStart(2, "0")}`;
        if (force || timeString !== lastTimeUI) {
          lastTimeUI = timeString;
          $("#hour-readout").textContent = timeString;
          if (!state.scrubbing) $("#time-slider").value = String(hour.toFixed(2));
          updateTimeButtons(hour);
        }
      }

      function getNightFactor(hour) {
        if (hour >= 18 && hour < 20) return smoothstep(18, 20, hour);
        if (hour >= 20 || hour < 5) return 1;
        if (hour >= 5 && hour < 6.5) return 1 - smoothstep(5, 6.5, hour);
        return 0;
      }

      function sampleSky(stops, hour) {
        for (let i = 0; i < stops.length - 1; i++) {
          const a = stops[i];
          const b = stops[i + 1];
          if (hour >= a[0] && hour <= b[0]) {
            const t = (hour - a[0]) / Math.max(0.001, b[0] - a[0]);
            return [
              new THREE.Color(a[1]).lerp(new THREE.Color(b[1]), t).getHex(),
              new THREE.Color(a[2]).lerp(new THREE.Color(b[2]), t).getHex(),
              new THREE.Color(a[3]).lerp(new THREE.Color(b[3]), t).getHex()
            ];
          }
        }
        return [stops[0][1], stops[0][2], stops[0][3]];
      }

      function updateTimeButtons(hour) {
        document.querySelectorAll(".preset-button").forEach((button) => {
          const active = Math.abs(Number(button.dataset.hour) - hour) < 0.09;
          button.setAttribute("aria-pressed", String(active));
        });
      }

      function applySeason(season, force = false) {
        if (!SEASONS[season]) return;
        state.season = season;
        const palette = SEASONS[season];
        materials.lawn.color.setHex(palette.lawn);
        materials.farGround.color.setHex(palette.lawn);
        if (treeSystem) {
          treeSystem.foliage.visible = season !== "winter";
          treeSystem.branches.visible = season === "winter";
          treeSystem.snowCaps.visible = season === "winter";
          const primary = new THREE.Color(palette.foliage);
          const secondary = new THREE.Color(palette.foliageAlt);
          for (let i = 0; i < treeSystem.foliage.count; i++) {
            treeSystem.foliage.setColorAt(i, i % 2 ? secondary : primary);
          }
          if (treeSystem.foliage.instanceColor) treeSystem.foliage.instanceColor.needsUpdate = true;
        }
        document.documentElement.style.setProperty("--season-wash", palette.wash);
        document.querySelectorAll(".season-button").forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.season === season));
        });
        if (particleSystem) resetParticles(season);
        applyTime(state.hour, true);
      }

      function setStop(index, options = {}) {
        const next = clamp(Math.round(Number(index)), 0, STOP_DATA.length - 1);
        if (!Number.isFinite(next)) return;
        if (state.flying && state.flight?.to === next && !options.instant) return;
        clearTimeout(state.autoTimer);
        state.autoTimer = 0;
        state.stop = next;
        state.flying = false;
        state.hold = null;
        state.chapterChanged = true;
        const pose = getStopPose(next);
        const startPosition = camera.position.clone();
        const startTarget = controls.target.clone();
        const duration = REDUCED_MOTION.matches || options.instant ? 0 : 2200;

        updateStopUI();
        if (!options.silent && state.sound) playChime();
        if (next === 5) setHour(20.5);

        if (duration === 0) {
          camera.position.copy(pose.position);
          controls.target.copy(pose.target);
          controls.update();
          state.flying = false;
          beginHold(next);
          if (state.auto) scheduleAuto();
          return;
        }

        state.flying = true;
        controls.enabled = false;
        state.flight = {
          to: next,
          start: performance.now(),
          duration,
          fromPosition: startPosition,
          fromTarget: startTarget,
          toPosition: pose.position,
          toTarget: pose.target
        };
        updateStopUI();
      }

      function completeFlight() {
        const flight = state.flight;
        if (!flight) return;
        camera.position.copy(flight.toPosition);
        controls.target.copy(flight.toTarget);
        controls.enabled = true;
        controls.update();
        state.flying = false;
        state.flight = null;
        beginHold(state.stop);
        updateStopUI();
        if (state.auto) scheduleAuto();
      }

      function updateFlight(now) {
        if (!state.flying || !state.flight) return false;
        const flight = state.flight;
        const raw = clamp((now - flight.start) / flight.duration, 0, 1);
        const t = easeInOutCubic(raw);
        camera.position.lerpVectors(flight.fromPosition, flight.toPosition, t);
        controls.target.lerpVectors(flight.fromTarget, flight.toTarget, t);
        if (raw >= 1) {
          completeFlight();
        }
        return true;
      }

      function getStopPose(index) {
        let pose;
        switch (index) {
          case 1:
            pose = { position: new THREE.Vector3(-1.95, 2.2, 2.38), target: new THREE.Vector3(-0.18, 1.65, -1.58), mobileScale: 1.12 };
            break;
          case 2: {
            const boat = boatGroupA?.position ?? new THREE.Vector3(-2, 0.3, 0.5);
            pose = {
              position: new THREE.Vector3(boat.x - 2.5, 0.76, 3.35),
              target: new THREE.Vector3(boat.x + 0.4, 0.38, boat.z),
              mobileScale: 1.02
            };
            pose.position.z = boat.z + 1.24;
            break;
          }
          case 3:
            pose = { position: new THREE.Vector3(-5.65, 5.1, 3.0), target: new THREE.Vector3(0.5, 1.55, -2.0), mobileScale: 1.34 };
            break;
          case 4:
            pose = { position: new THREE.Vector3(-4.65, 2.7, 5.1), target: new THREE.Vector3(0.2, 1.35, -0.12), mobileScale: 1.38 };
            break;
          case 5:
            pose = { position: new THREE.Vector3(10.7, 7.4, 10.4), target: new THREE.Vector3(0, 0.84, 0), mobileScale: 1.68 };
            break;
          case 6:
          case 0:
          default:
            pose = { position: new THREE.Vector3(9.5, 8.3, 11.6), target: new THREE.Vector3(0, 0.78, 0), mobileScale: 1.72 };
            break;
        }
        if (window.innerWidth <= 900) {
          pose.position.sub(pose.target).multiplyScalar(pose.mobileScale).add(pose.target);
        }
        return pose;
      }

      function beginHold(index) {
        const now = performance.now();
        state.hold = null;
        if (index === 1) {
          const target = controls.target.clone();
          const offset = camera.position.clone().sub(target);
          state.hold = { type: "pearlOrbit", start: now, target, offset };
        } else if (index === 2) {
          state.viewBoat = boatGroupA;
          state.hold = { type: "boatFollow", start: now };
        } else if (index === 3) {
          state.hold = { type: "lujiazuiArc", start: now };
        } else if (index === 4) {
          state.hold = { type: "bundSlide", start: now };
        }
      }

      function updateHold(now) {
        if (!state.hold || state.userControlling || REDUCED_MOTION.matches) return;
        const hold = state.hold;
        if (hold.type === "pearlOrbit") {
          const elapsed = Math.min((now - hold.start) / 1000, 12);
          const angle = -0.18 + (elapsed / 10) * 0.36;
          const offset = hold.offset.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), angle);
          camera.position.copy(hold.target).add(offset);
        } else if (hold.type === "boatFollow") {
          const boat = state.viewBoat;
          if (boat) {
            const desired = new THREE.Vector3(boat.position.x - 2.15, 0.72, boat.position.z + 1.22);
            const desiredTarget = new THREE.Vector3(boat.position.x + 0.55, 0.34, boat.position.z);
            camera.position.lerp(desired, 0.024);
            controls.target.lerp(desiredTarget, 0.055);
          }
        } else if (hold.type === "lujiazuiArc") {
          const elapsed = (now - hold.start) / 1000;
          const p = (1 - Math.cos(elapsed * 0.14)) * 0.5;
          camera.position.set(lerp(-5.1, 5.35, p), lerp(5.05, 5.35, p), 3.05 - 0.65 * Math.sin(p * Math.PI));
          controls.target.set(lerp(0.5, 1.15, p), 1.58, -2.0);
        } else if (hold.type === "bundSlide") {
          const elapsed = (now - hold.start) / 1000;
          const p = (1 - Math.cos(elapsed * 0.11)) * 0.5;
          camera.position.set(lerp(-4.7, 4.0, p), 2.55 + 0.18 * Math.sin(p * Math.PI), 5.05);
          controls.target.set(lerp(0.2, 0.7, p), 1.36, -0.05);
        }
      }

      function updateStopUI() {
        const data = STOP_DATA[state.stop];
        $("#chapter-index").textContent = `${String(state.stop + 1).padStart(2, "0")} / 07`;
        $("#caption-title").textContent = data.title;
        $("#caption-copy").textContent = data.copy;
        $("#progress-label").textContent = `${state.stop + 1} / 7`;
        const next = $("#next-button");
        const prev = $("#prev-button");
        next.disabled = state.flying;
        prev.disabled = state.flying || state.stop === 0;
        next.textContent = state.flying ? "镜头转动中…" : "下一步";
        prev.textContent = state.stop === 0 && !state.flying ? "已到开头" : "上一步";
        $("#auto-button").setAttribute("aria-pressed", String(state.auto));
        $("#auto-button").textContent = state.auto ? "暂停" : "自动播放";
        document.querySelectorAll(".progress-dot").forEach((dot) => {
          const active = Number(dot.dataset.stop) === state.stop;
          if (active) dot.setAttribute("aria-current", "step");
          else dot.removeAttribute("aria-current");
        });
        updateRingVisibility();
      }

      function updateRingVisibility() {
        if (!ring) return;
        const visible = state.stop !== 0 && state.stop !== 6;
        ring.visible = visible;
        ringGlow.visible = visible;
        if (!visible) return;
        const target = getRingTarget();
        ring.position.copy(target);
        ringGlow.position.copy(target);
      }

      function getRingTarget() {
        const y = 0.105;
        switch (state.stop) {
          case 1: return new THREE.Vector3(-0.18, y, -1.58);
          case 2: {
            const boat = state.viewBoat || boatGroupA;
            return new THREE.Vector3(boat.position.x, 0.19, boat.position.z);
          }
          case 3: return new THREE.Vector3(-1.55, y, -2.76);
          case 4: return new THREE.Vector3(0.16, 0.1, 2.38);
          case 5: return new THREE.Vector3(4.45, y, 2.52);
          default: return new THREE.Vector3(0, 0.08, 2.1);
        }
      }

      function setAuto(active) {
        state.auto = active;
        clearTimeout(state.autoTimer);
        state.autoTimer = 0;
        updateStopUI();
        if (active) scheduleAuto();
      }

      function scheduleAuto() {
        clearTimeout(state.autoTimer);
        if (!state.auto) return;
        state.autoTimer = window.setTimeout(() => {
          if (!state.auto) return;
          setStop((state.stop + 1) % 7);
        }, 12000);
      }

      function updateRendererSize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.7));
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.fov = width <= 520 ? 48 : width <= 900 ? 43 : width <= 1040 ? 40 : 37;
        camera.updateProjectionMatrix();
        if (width <= 900) {
          setPanel(false);
          if (!state.flying && !state.userControlling && (state.stop === 0 || state.stop === 6)) {
            const pose = getStopPose(state.stop);
            camera.position.copy(pose.position);
            controls.target.copy(pose.target);
            controls.update();
          }
        } else {
          setPanel(true);
        }
      }

      function handleReducedMotionChange() {
        if (REDUCED_MOTION.matches) {
          if (particleSystem) particleSystem.mesh.visible = false;
          if (state.flying && state.flight) {
            camera.position.copy(state.flight.toPosition);
            controls.target.copy(state.flight.toTarget);
            controls.enabled = true;
            state.flying = false;
            state.flight = null;
            updateStopUI();
          }
        } else if (particleSystem) {
          resetParticles(state.season);
        }
      }

      function ensureAudioContext() {
        if (!audioContext) {
          const Context = window.AudioContext || window.webkitAudioContext;
          if (Context) audioContext = new Context();
        }
        if (audioContext?.state === "suspended") audioContext.resume().catch(() => {});
      }

      function playHorn() {
        if (!state.sound) return;
        ensureAudioContext();
        if (!audioContext) return;
        const now = audioContext.currentTime;
        const gain = audioContext.createGain();
        const filter = audioContext.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 440;
        filter.Q.value = 0.7;
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.1, now + 0.2);
        gain.gain.setValueAtTime(0.1, now + 0.6);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.82);
        filter.connect(gain).connect(audioContext.destination);
        for (const frequency of [96, 98]) {
          const osc = audioContext.createOscillator();
          osc.type = "triangle";
          osc.frequency.value = frequency;
          osc.detune.value = frequency === 98 ? 6 : -4;
          osc.connect(filter);
          osc.start(now);
          osc.stop(now + 0.86);
        }
      }

      function playChime() {
        if (!state.sound || !audioContext) return;
        const now = audioContext.currentTime;
        [523.25, 659.25].forEach((frequency, index) => {
          const gain = audioContext.createGain();
          gain.gain.setValueAtTime(0.0001, now + index * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.038, now + index * 0.08 + 0.035);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.08 + 0.52);
          const osc = audioContext.createOscillator();
          osc.type = "sine";
          osc.frequency.value = frequency;
          osc.connect(gain).connect(audioContext.destination);
          osc.start(now + index * 0.08);
          osc.stop(now + index * 0.08 + 0.56);
        });
      }

      function onPointerDown(event) {
        ensureAudioContext();
        if (event.pointerType === "touch") canvas.setPointerCapture?.(event.pointerId);
        state.isDragging = true;
        canvas.classList.add("is-dragging");
        pointerDown = { x: event.clientX, y: event.clientY, time: performance.now() };
        lastPointer = { x: event.clientX, y: event.clientY };
        state.chapterChanged = false;
      }

      function onPointerMove(event) {
        lastPointer = { x: event.clientX, y: event.clientY };
        if (!state.isDragging) {
          const pick = raycastAt(event.clientX, event.clientY);
          canvas.classList.toggle("is-hovering", Boolean(pick));
        }
      }

      function onPointerUp(event) {
        if (!state.isDragging) return;
        state.isDragging = false;
        canvas.classList.remove("is-dragging");
        const distance = Math.hypot(event.clientX - pointerDown.x, event.clientY - pointerDown.y);
        if (distance > 7 || performance.now() - pointerDown.time > 600) return;
        const pick = raycastAt(event.clientX, event.clientY);
        if (!pick) return;
        const boat = findAncestorData(pick, "boat");
        if (boat !== undefined) {
          playHorn();
          return;
        }
        const stop = findAncestorData(pick, "stop");
        if (Number.isInteger(stop)) {
          setStop(stop, { point: true });
        }
      }

      function raycastAt(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const nx = ((clientX - rect.left) / rect.width) * 2 - 1;
        const ny = -((clientY - rect.top) / rect.height) * 2 + 1;
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(new THREE.Vector2(nx, ny), camera);
        const intersections = raycaster.intersectObjects(interactiveObjects, true);
        return intersections.find((intersection) => intersection.object.visible && intersection.object.material?.opacity !== 0)?.object ?? null;
      }

      function findAncestorData(object, key) {
        let current = object;
        while (current) {
          if (Object.prototype.hasOwnProperty.call(current.userData, key)) return current.userData[key];
          current = current.parent;
        }
        return undefined;
      }

      function animate() {
        requestAnimationFrame(animate);
        const now = performance.now();
        const dt = Math.min(clock.getDelta(), 0.05);
        const elapsed = clock.elapsedTime;

        if (state.timeTween) {
          const t = clamp((now - state.timeTween.start) / state.timeTween.duration, 0, 1);
          state.hour = lerp(state.timeTween.from, state.timeTween.to, easeInOutCubic(t));
          applyTime(state.hour);
          if (t >= 1) {
            state.timeTween = null;
            renderer.shadowMap.needsUpdate = true;
          }
        }
        if (state.timeTween && frameCount % 8 === 0) {
          renderer.shadowMap.needsUpdate = true;
        }

        const wasFlying = state.flying;
        if (wasFlying) updateFlight(now);
        if (!wasFlying || !state.flying) updateHold(now);
        controls.update();
        animateWater(elapsed);
        animateSparkles(elapsed);
        animateBoat(elapsed, dt);
        animateCars(elapsed);
        animatePedestrians(elapsed);
        animateParticles(dt);
        animateReflections(elapsed);
        animateRing(elapsed);
        renderer.render(scene, camera);
        frameCount++;
      }

      function animateWater(elapsed) {
        if (!waterMesh) return;
        const position = waterMesh.geometry.attributes.position;
        const base = waterMesh.userData.waterBase;
        for (let i = 0; i < position.count; i++) {
          const x = base[i * 3];
          const z = base[i * 3 + 2];
          const y = 0.145 +
            0.026 * Math.sin(x * 1.55 + elapsed * 0.9) +
            0.018 * Math.sin(z * 4.7 - elapsed * 1.25 + x * 0.45) +
            0.008 * Math.sin((x + z) * 5.1 + elapsed * 0.55);
          position.setY(i, y);
        }
        position.needsUpdate = true;
        if (frameCount % 2 === 0) waterMesh.geometry.computeVertexNormals();
      }

      function animateSparkles(elapsed) {
        const prop = animatedProps.find((item) => item.type === "sparkles");
        if (!prop) return;
        const dummy = new THREE.Object3D();
        for (let i = 0; i < prop.mesh.count; i++) {
          const phase = i * 1.73;
          const x = -4.4 + ((i * 1.91 + elapsed * (0.055 + i % 3 * 0.012)) % 8.8);
          const z = riverCurve(x) - 0.83 + ((i * 0.37) % 1.66);
          dummy.position.set(x, 0.178 + 0.007 * Math.sin(elapsed * 1.8 + phase), z);
          dummy.rotation.set(-Math.PI / 2, 0, phase + Math.sin(elapsed + i) * 0.1);
          dummy.scale.setScalar(0.55 + 0.55 * (0.5 + 0.5 * Math.sin(elapsed * 1.4 + phase)));
          dummy.updateMatrix();
          prop.mesh.setMatrixAt(i, dummy.matrix);
        }
        prop.mesh.instanceMatrix.needsUpdate = true;
      }

      function animateBoat(elapsed, dt) {
        const prop = animatedProps.find((item) => item.type === "boats");
        if (!prop) return;
        prop.boats.forEach((boat, index) => {
          const t = (elapsed * 0.0115 + index * 0.49) % 1;
          const point = prop.path.getPointAt(t);
          const tangent = prop.path.getTangentAt(t);
          boat.position.copy(point);
          boat.position.y = 0.2 + 0.018 * Math.sin(elapsed * 1.35 + index * 2.1);
          boat.rotation.set(
            0.02 * Math.sin(elapsed * 0.9 + index),
            Math.atan2(tangent.z, tangent.x) * -1 + Math.PI,
            THREE.MathUtils.degToRad(3) * Math.sin(elapsed * 1.03 + index * 1.8)
          );
          animateWake(boat, dt, elapsed);
        });
      }

      function animateWake(boat, dt, elapsed) {
        const wake = boat.children.find((child) => child.userData.wake);
        if (!wake) return;
        const positions = wake.geometry.attributes.position;
        wake.userData.age += dt;
        wake.userData.next -= dt;
        if (wake.userData.next <= 0) {
          wake.userData.next = 0.07;
          const index = wake.userData.cursor || 0;
          positions.setXYZ(index, range(-0.05, 0.07), range(-0.015, 0.02), range(-0.06, 0.06));
          wake.userData.cursor = (index + 1) % positions.count;
        }
        for (let i = 0; i < positions.count; i++) {
          const y = positions.getY(i);
          if (y > -0.5) {
            positions.setX(i, positions.getX(i) - dt * 0.11);
            positions.setZ(i, positions.getZ(i) + Math.sin(elapsed + i) * dt * 0.006);
            positions.setY(i, y - dt * 0.03);
          }
        }
        positions.needsUpdate = true;
      }

      function animateCars(elapsed) {
        if (!carSystem) return;
        const { bodies, roofs, headlights, cars, dummy } = carSystem;
        const lightDummy = new THREE.Object3D();
        for (let i = 0; i < cars.length; i++) {
          const car = cars[i];
          const t = (car.t + elapsed * car.speed * car.direction + 1) % 1;
          const { cx, cz, w, d } = car.lane;
          const perimeter = 2 * (w + d);
          let distance = t * perimeter;
          let x;
          let z;
          let heading;
          if (distance < w) {
            x = cx - w / 2 + distance; z = cz + d / 2; heading = Math.PI / 2;
          } else if ((distance -= w) < d) {
            x = cx + w / 2; z = cz + d / 2 - distance; heading = Math.PI;
          } else if ((distance -= d) < w) {
            x = cx + w / 2 - distance; z = cz - d / 2; heading = -Math.PI / 2;
          } else {
            distance -= w;
            x = cx - w / 2; z = cz - d / 2 + distance; heading = 0;
          }
          dummy.position.set(x, 0.13, z);
          dummy.rotation.set(0, heading + (car.direction < 0 ? Math.PI : 0), 0);
          dummy.updateMatrix();
          bodies.setMatrixAt(i, dummy.matrix);
          dummy.position.y += 0.064;
          dummy.scale.set(1, 1, 1);
          dummy.updateMatrix();
          roofs.setMatrixAt(i, dummy.matrix);
          for (let side = 0; side < 2; side++) {
            lightDummy.position.set(x, 0.145, z);
            lightDummy.rotation.set(0, heading + (car.direction < 0 ? Math.PI : 0), 0);
            const local = new THREE.Vector3(0.128, 0, side ? 0.038 : -0.038).applyAxisAngle(new THREE.Vector3(0, 1, 0), lightDummy.rotation.y);
            lightDummy.position.add(local);
            lightDummy.updateMatrix();
            headlights.setMatrixAt(i * 2 + side, lightDummy.matrix);
          }
        }
        bodies.instanceMatrix.needsUpdate = true;
        roofs.instanceMatrix.needsUpdate = true;
        headlights.instanceMatrix.needsUpdate = true;
      }

      function animatePedestrians(elapsed) {
        if (!pedestrianSystem) return;
        const { bodies, heads, people, dummy } = pedestrianSystem;
        for (let i = 0; i < people.length; i++) {
          const person = people[i];
          const sway = Math.sin(elapsed * person.speed + person.phase);
          const bob = Math.abs(Math.sin(elapsed * person.speed * 2 + person.phase)) * 0.012;
          const walk = Math.sin(elapsed * 0.21 + person.phase) > 0.67 ? 0.25 : 1;
          const x = person.baseX + sway * person.amplitude * walk;
          const z = person.baseZ + Math.cos(elapsed * person.speed * 0.45 + person.phase) * 0.065;
          const yaw = Math.cos(elapsed * person.speed + person.phase) >= 0 ? Math.PI / 2 : -Math.PI / 2;
          dummy.position.set(x, 0.16 + bob, z);
          dummy.rotation.set(0, yaw, 0);
          dummy.scale.setScalar(person.scale);
          dummy.updateMatrix();
          bodies.setMatrixAt(i, dummy.matrix);
          dummy.position.y += 0.095 * person.scale;
          dummy.updateMatrix();
          heads.setMatrixAt(i, dummy.matrix);
        }
        bodies.instanceMatrix.needsUpdate = true;
        heads.instanceMatrix.needsUpdate = true;
      }

      function animateParticles(dt) {
        if (!particleSystem || !particleSystem.mesh.visible || REDUCED_MOTION.matches || state.season === "summer") return;
        const { particles, dummy, colorBuffer, alphaBuffer, geometry } = particleSystem;
        const isAutumn = state.season === "autumn";
        const isWinter = state.season === "winter";
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          if (p.resting) {
            p.rest -= dt;
            if (p.rest <= 0) {
              respawnParticle(p);
            } else {
              const fade = clamp(p.rest / 0.9, 0, 1);
              p.alpha = Math.min(0.72, fade * 0.72);
            }
          } else {
            p.alpha = 0.72;
            p.speed = isWinter ? p.speed : p.speed;
            p.y -= p.speed * dt;
            p.x += Math.sin(elapsedForParticles() * (isAutumn ? 1.8 : 0.7) + p.phase) * p.sway * dt;
            p.z += Math.cos(elapsedForParticles() * 0.45 + p.phase) * p.sway * 0.55 * dt;
            p.rotation.x += p.spin.x * dt * (isAutumn ? 1.8 : 0.5);
            p.rotation.y += p.spin.y * dt * (isAutumn ? 1.4 : 0.4);
            p.rotation.z += p.spin.z * dt * (isAutumn ? 1.2 : 0.25);
            const overRiver = Math.abs(p.z - riverCurve(p.x)) < 1.12;
            if (p.y <= (overRiver ? 0.155 : 0.12)) {
              p.y = overRiver ? 0.155 : 0.12;
              p.resting = true;
              p.rest = overRiver ? 0.45 : 3;
              p.rotation.x = -Math.PI / 2;
              p.rotation.z = 0;
            }
          }
          dummy.position.set(p.x, p.y, p.z);
          dummy.rotation.copy(p.rotation);
          const scale = isWinter ? rangeForParticle(i, 0.55, 0.95) : isAutumn ? rangeForParticle(i, 0.62, 1.05) : rangeForParticle(i, 0.58, 0.95);
          dummy.scale.set(scale, scale, scale);
          dummy.updateMatrix();
          particleSystem.mesh.setMatrixAt(i, dummy.matrix);
          alphaBuffer[i] = p.alpha;
        }
        particleSystem.mesh.instanceMatrix.needsUpdate = true;
        geometry.attributes.aAlpha.needsUpdate = true;
        geometry.attributes.aColor.needsUpdate = false;
      }

      function elapsedForParticles() {
        return clock.elapsedTime;
      }

      function rangeForParticle(index, min, max) {
        return min + (max - min) * (0.5 + 0.5 * Math.sin(index * 12.9898));
      }

      function animateReflections(elapsed) {
        for (let i = 0; i < waterReflections.length; i++) {
          const reflection = waterReflections[i];
          const x = -4.35 + ((i * 1.17 + elapsed * 0.04 * (i % 2 ? -1 : 1) + 8.7) % 8.7);
          const z = riverCurve(x) + (reflection.userData.side === "near" ? 0.58 : -0.56);
          reflection.position.x = x;
          reflection.position.z = z;
          reflection.scale.x = 0.6 + 0.6 * (0.5 + 0.5 * Math.sin(elapsed * 1.15 + reflection.userData.phase));
          reflection.scale.y = 0.65 + 0.35 * Math.sin(elapsed * 1.7 + i);
          reflection.material.opacity = getNightFactor(state.hour) * (0.34 + 0.23 * (0.5 + 0.5 * Math.sin(elapsed * 0.95 + i)));
        }
      }

      function animateRing(elapsed) {
        if (!ring || !ring.visible) return;
        ring.position.copy(getRingTarget());
        ringGlow.position.copy(ring.position);
        if (REDUCED_MOTION.matches) {
          ring.scale.setScalar(1);
          ringGlow.scale.setScalar(1);
          ring.material.opacity = 0.52;
          ringGlow.material.opacity = 0.16;
          return;
        }
        const pulse = 1 + 0.08 * Math.sin(elapsed * 2.1);
        ring.scale.setScalar(pulse);
        ringGlow.scale.setScalar(1.08 + 0.12 * Math.sin(elapsed * 1.6 + 0.8));
        ring.material.opacity = 0.54 + 0.16 * Math.sin(elapsed * 1.85);
        ringGlow.material.opacity = 0.13 + 0.08 * Math.sin(elapsed * 1.5 + 1);
      }

      function exposeDebugApi() {
        const api = {
          get stop() { return state.stop; },
          set stop(value) { setStop(value, { instant: true }); },
          setStop,
          get hour() { return state.hour; },
          set hour(value) { setHour(value, { instant: true }); },
          get season() { return state.season; },
          set season(value) { applySeason(value); }
        };
        Object.defineProperty(api, "setCamera", {
          enumerable: false,
          value: (x, y, z, tx, ty, tz) => {
            camera.position.set(x, y, z);
            controls.target.set(tx, ty, tz);
            controls.update();
          }
        });
        Object.defineProperty(api, "projectLandmark", {
          enumerable: false,
          value: (stopIndex) => {
            const probes = {
              1: new THREE.Vector3(-0.18, 1.2, -1.58),
              2: new THREE.Vector3(0, 0.17, 0),
              3: new THREE.Vector3(-1.55, 2.3, -2.76),
              4: new THREE.Vector3(0.16, 1.3, 2.4),
              5: new THREE.Vector3(4.45, 0.6, 2.52)
            };
            const center = probes[stopIndex];
            if (!center) return null;
            camera.updateMatrixWorld();
            center.project(camera);
            return { x: (center.x * 0.5 + 0.5) * window.innerWidth, y: (-center.y * 0.5 + 0.5) * window.innerHeight };
          }
        });
        Object.defineProperty(api, "debugScene", {
          enumerable: false,
          value: () => scene
        });
        window.__huangpu = api;
      }
    }
  </script>
