<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2eadf">
  <link rel="icon" href="data:,">
  <title>黄浦灯火。</title>
  <style>
    :root {
      --paper: #f5eee3;
      --paper-bright: #fbf7ef;
      --paper-deep: #e7dccd;
      --ink: #253b3f;
      --ink-soft: #5c6d6d;
      --teal: #6d9d98;
      --teal-deep: #477773;
      --sand: #d8b888;
      --sand-deep: #b38d61;
      --glass: #7d9eab;
      --glass-deep: #547785;
      --rose: #c88199;
      --border: rgba(55, 80, 81, .16);
      --sky-top: #c9d8d4;
      --sky-mid: #e8e6da;
      --sky-bottom: #f5eee3;
      --season-wash: rgba(229, 160, 181, .06);
      --shadow: 0 18px 60px rgba(39, 59, 59, .12);
      --serif: "Iowan Old Style", "Baskerville", "Noto Serif SC", "Songti SC", "STSong", serif;
      --sans: "Avenir Next", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--teal-deep);
      outline-offset: 3px;
    }

    .app {
      position: fixed;
      inset: 0;
      isolation: isolate;
      background:
        radial-gradient(circle at 76% 17%, rgba(255, 255, 255, .35), transparent 35%),
        linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 50%, var(--sky-bottom) 100%);
      transition: background-color .8s linear;
    }

    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 52%, transparent 35%, rgba(86, 105, 99, .55) 115%),
        linear-gradient(180deg, transparent 44%, var(--season-wash));
      pointer-events: none;
      z-index: 1;
    }

    .app::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .16;
      pointer-events: none;
      z-index: 2;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.8) 0 1px, transparent 1.5px),
        radial-gradient(circle at 75% 65%, rgba(35,59,61,.25) 0 1px, transparent 1.5px);
      background-size: 87px 91px, 113px 107px;
      mix-blend-mode: soft-light;
    }

    #scene {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      z-index: 0;
      touch-action: none;
      cursor: grab;
    }

    #scene.is-hovering {
      cursor: pointer;
    }

    #scene.is-dragging {
      cursor: grabbing;
    }

    .ui {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    .ui button,
    .ui input,
    .ui .interactive {
      pointer-events: auto;
    }

    .brand {
      position: absolute;
      top: clamp(20px, 4vw, 42px);
      left: clamp(20px, 4vw, 48px);
      width: min(460px, calc(100vw - 40px));
      pointer-events: none;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .24);
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: 11px;
      line-height: 1;
      letter-spacing: .2em;
      font-weight: 600;
      color: var(--teal-deep);
    }

    .brand h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(35px, 4.6vw, 64px);
      line-height: .98;
      letter-spacing: -.045em;
      color: var(--ink);
    }

    .subtitle {
      margin: 10px 0 0;
      font-size: 13px;
      letter-spacing: .09em;
      color: var(--ink-soft);
    }

    .status-pill {
      position: absolute;
      top: clamp(20px, 4vw, 42px);
      right: clamp(20px, 4vw, 48px);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid rgba(67, 101, 101, .18);
      border-radius: 999px;
      background: rgba(249, 245, 236, .68);
      backdrop-filter: blur(16px) saturate(1.1);
      -webkit-backdrop-filter: blur(16px) saturate(1.1);
      box-shadow: 0 8px 28px rgba(41, 64, 63, .08);
      font-size: 11px;
      letter-spacing: .08em;
      color: var(--ink-soft);
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #5c9e83;
      box-shadow: 0 0 0 4px rgba(92, 158, 131, .12);
    }

    .side-panel {
      position: absolute;
      top: 96px;
      right: clamp(20px, 4vw, 48px);
      width: 286px;
      padding: 18px;
      border: 1px solid rgba(62, 88, 87, .16);
      border-radius: 22px;
      background: rgba(249, 246, 238, .77);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px) saturate(1.2);
      -webkit-backdrop-filter: blur(22px) saturate(1.2);
      transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .3s ease;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 24px;
      margin-bottom: 14px;
    }

    .panel-kicker {
      font-size: 10px;
      letter-spacing: .18em;
      font-weight: 600;
      color: var(--teal-deep);
    }

    .panel-close,
    .panel-toggle {
      display: none;
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: rgba(251, 248, 241, .82);
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .panel-close {
      font-size: 22px;
      font-weight: 400;
      line-height: 1;
    }

    .control-block + .control-block {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid rgba(65, 88, 87, .11);
    }

    .control-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 9px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .16em;
      color: var(--ink-soft);
    }

    .hour-readout {
      font-size: 17px;
      letter-spacing: -.02em;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }

    .time-slider {
      width: 100%;
      height: 36px;
      margin: -5px 0 0;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: ew-resize;
      touch-action: none;
      pointer-events: auto;
    }

    .time-slider::-webkit-slider-runnable-track {
      height: 8px;
      border: 1px solid rgba(58, 82, 81, .14);
      border-radius: 99px;
      background:
        linear-gradient(90deg,
          #718b96 0%,
          #e4bc9c 22%,
          #f5ebd4 40%,
          #f1c596 66%,
          #b58e83 77%,
          #5e7482 100%);
    }

    .time-slider::-moz-range-track {
      height: 8px;
      border: 1px solid rgba(58, 82, 81, .14);
      border-radius: 99px;
      background:
        linear-gradient(90deg,
          #718b96 0%,
          #e4bc9c 22%,
          #f5ebd4 40%,
          #f1c596 66%,
          #b58e83 77%,
          #5e7482 100%);
    }

    .time-slider::-webkit-slider-thumb {
      width: 25px;
      height: 25px;
      margin-top: -9.5px;
      border: 3px solid #fbf8f1;
      border-radius: 50%;
      appearance: none;
      -webkit-appearance: none;
      background: var(--teal-deep);
      box-shadow: 0 3px 12px rgba(37, 59, 63, .28), 0 0 0 4px rgba(109, 157, 152, .1);
      transition: transform .12s ease, box-shadow .12s ease;
    }

    .time-slider::-moz-range-thumb {
      width: 19px;
      height: 19px;
      border: 3px solid #fbf8f1;
      border-radius: 50%;
      background: var(--teal-deep);
      box-shadow: 0 3px 12px rgba(37, 59, 63, .28);
    }

    .time-slider:active::-webkit-slider-thumb {
      transform: scale(1.12);
      box-shadow: 0 3px 14px rgba(37, 59, 63, .32), 0 0 0 6px rgba(109, 157, 152, .14);
    }

    .time-slider:active::-moz-range-thumb {
      box-shadow: 0 3px 14px rgba(37, 59, 63, .32), 0 0 0 6px rgba(109, 157, 152, .14);
    }

    .chip-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-top: 8px;
    }

    .chip,
    .season-button,
    .sound-button,
    .reset-button {
      min-height: 34px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: rgba(255, 255, 255, .3);
      color: var(--ink-soft);
      font-size: 12px;
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, color .18s ease, transform .18s ease;
    }

    .chip:hover,
    .season-button:hover,
    .sound-button:hover,
    .reset-button:hover {
      background: rgba(255, 255, 255, .62);
      border-color: rgba(68, 102, 101, .15);
    }

    .chip:active,
    .season-button:active,
    .sound-button:active,
    .reset-button:active {
      transform: translateY(1px);
    }

    .chip[aria-pressed="true"],
    .season-button[aria-pressed="true"],
    .sound-button[aria-pressed="true"] {
      background: var(--ink);
      border-color: var(--ink);
      color: #f8f3e9;
    }

    .season-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .season-button {
      position: relative;
      min-height: 46px;
      padding-top: 7px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .38);
    }

    .season-button::before {
      content: "";
      display: block;
      width: 7px;
      height: 7px;
      margin: 0 auto 4px;
      border-radius: 50%;
      background: var(--season-dot, var(--teal));
      transition: background .25s ease;
    }

    .season-button[data-season="spring"] { --season-dot: #d28fa6; }
    .season-button[data-season="summer"] { --season-dot: #547e67; }
    .season-button[data-season="autumn"] { --season-dot: #c68b4e; }
    .season-button[data-season="winter"] { --season-dot: #a9b9bc; }

    .utility-row {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 8px;
    }

    .sound-button,
    .reset-button {
      min-height: 38px;
      background: rgba(255, 255, 255, .38);
    }

    .sound-button::before {
      content: "○";
      margin-right: 6px;
      font-size: 10px;
    }

    .sound-button[aria-pressed="true"]::before {
      content: "●";
    }

    .caption-card {
      position: absolute;
      left: max(24px, calc((100vw - 360px) / 2));
      bottom: clamp(18px, 3vw, 34px);
      width: min(720px, calc(100vw - 390px));
      min-width: 500px;
      transform: translateX(-50%);
      padding: 18px 20px 14px;
      border: 1px solid rgba(57, 83, 83, .16);
      border-radius: 22px;
      background: rgba(250, 247, 240, .82);
      box-shadow: 0 18px 65px rgba(35, 57, 58, .14);
      backdrop-filter: blur(24px) saturate(1.15);
      -webkit-backdrop-filter: blur(24px) saturate(1.15);
    }

    .caption-topline {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 5px;
    }

    .chapter-index {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .14em;
      color: var(--teal-deep);
    }

    .caption-title {
      margin: 0;
      font-family: var(--serif);
      font-size: 23px;
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -.025em;
    }

    .caption-copy {
      min-height: 20px;
      margin: 0;
      font-size: 13px;
      line-height: 1.55;
      color: var(--ink-soft);
    }

    .caption-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }

    .tour-button {
      min-height: 38px;
      padding: 0 16px;
      border: 1px solid rgba(52, 78, 78, .15);
      border-radius: 11px;
      background: rgba(255, 255, 255, .42);
      color: var(--ink);
      font-size: 12px;
      cursor: pointer;
      transition: background .18s ease, opacity .18s ease, transform .18s ease;
    }

    .tour-button:hover:not(:disabled) {
      background: rgba(255, 255, 255, .78);
    }

    .tour-button:active:not(:disabled) {
      transform: translateY(1px);
    }

    .tour-button.primary {
      min-width: 94px;
      border-color: var(--ink);
      background: var(--ink);
      color: #fbf7ef;
    }

    .tour-button.primary:hover:not(:disabled) {
      background: #365154;
    }

    .tour-button:disabled {
      cursor: default;
      opacity: .45;
    }

    .auto-button {
      margin-left: auto;
      background: transparent;
    }

    .auto-button[aria-pressed="true"] {
      border-color: rgba(71, 119, 115, .35);
      background: rgba(109, 157, 152, .14);
      color: var(--teal-deep);
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid rgba(62, 86, 85, .09);
    }

    .dots {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .progress-dot {
      position: relative;
      width: 7px;
      height: 7px;
      padding: 0;
      border: 0;
      border-radius: 99px;
      background: rgba(50, 77, 78, .18);
      cursor: pointer;
      transition: width .25s ease, background .25s ease;
    }

    .progress-dot::before {
      content: "";
      position: absolute;
      inset: -7px -5px;
    }

    .progress-dot[aria-current="step"] {
      width: 22px;
      background: var(--teal-deep);
    }

    .progress-count {
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      letter-spacing: .12em;
      color: var(--ink-soft);
    }

    .help-line {
      position: absolute;
      left: clamp(20px, 4vw, 48px);
      bottom: clamp(18px, 3vw, 34px);
      max-width: 320px;
      font-size: 11px;
      letter-spacing: .045em;
      color: var(--ink-soft);
      text-shadow: 0 1px 0 rgba(255, 255, 255, .45);
    }

    .panel-toggle {
      position: absolute;
      top: 72px;
      right: clamp(20px, 4vw, 48px);
      z-index: 7;
      font-size: 18px;
      line-height: 1;
    }

    .fallback {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(circle at 70% 24%, rgba(133, 171, 167, .22), transparent 34%),
        linear-gradient(180deg, #e9e5d9, #f7f0e5 58%, #e8d9c6);
      text-align: center;
    }

    .fallback[hidden] {
      display: none;
    }

    .fallback-mark {
      margin-bottom: 13px;
      font-family: var(--serif);
      font-size: clamp(36px, 6vw, 68px);
      letter-spacing: -.05em;
    }

    .fallback h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 500;
    }

    .fallback p {
      margin: 10px 0 0;
      color: var(--ink-soft);
      font-size: 13px;
    }

    .is-fallback .app,
    .is-fallback .ui {
      display: none;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 1040px) {
      .caption-card {
        width: min(650px, calc(100vw - 390px));
        min-width: 460px;
      }

      .side-panel {
        width: 264px;
      }

      .help-line {
        max-width: 250px;
        line-height: 1.45;
        display: none;
      }
    }

    @media (max-width: 1350px) {
      .help-line {
        display: none;
      }
    }

    @media (min-width: 1360px) {
      .caption-card {
        left: 50%;
      }
    }

    @media (max-width: 900px) {
      .app::after {
        opacity: .1;
      }

      .brand {
        top: max(20px, env(safe-area-inset-top));
        left: 18px;
        width: calc(100vw - 120px);
      }

      .eyebrow {
        margin-bottom: 7px;
        font-size: 9px;
      }

      .brand h1 {
        font-size: clamp(32px, 9.5vw, 43px);
      }

      .subtitle {
        margin-top: 7px;
        font-size: 11px;
      }

      .status-pill {
        top: max(20px, env(safe-area-inset-top));
        right: 16px;
        min-height: 32px;
        padding: 0 11px;
        font-size: 9px;
      }

      .panel-toggle {
        display: flex;
        top: 64px;
        right: 16px;
      }

      .side-panel {
        top: auto;
        right: 0;
        bottom: 0;
        left: 0;
        width: 100%;
        max-height: 44dvh;
        margin: 0;
        padding: 14px 18px calc(18px + env(safe-area-inset-bottom));
        border-radius: 24px 24px 0 0;
        border-right: 0;
        border-bottom: 0;
        border-left: 0;
        overflow: auto;
        overscroll-behavior: contain;
        opacity: 0;
        pointer-events: none;
        transform: translateY(105%);
        z-index: 12;
      }

      .side-panel.is-open {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      .panel-close {
        display: flex;
      }

      .control-block + .control-block {
        margin-top: 13px;
        padding-top: 12px;
      }

      .caption-card {
        left: 8px;
        right: 8px;
        bottom: max(8px, env(safe-area-inset-bottom));
        width: auto;
        min-width: 0;
        max-height: 44dvh;
        padding: 13px 14px 10px;
        transform: none;
        border-radius: 19px;
        overflow: auto;
        overscroll-behavior: contain;
      }

      .caption-topline {
        margin-bottom: 3px;
      }

      .caption-title {
        font-size: 19px;
      }

      .caption-copy {
        font-size: 12px;
        line-height: 1.42;
      }

      .caption-actions {
        gap: 6px;
        margin-top: 9px;
      }

      .tour-button {
        min-height: 36px;
        padding: 0 11px;
        font-size: 11px;
      }

      .tour-button.primary {
        min-width: 82px;
      }

      .auto-button {
        padding: 0 9px;
      }

      .card-footer {
        margin-top: 8px;
        padding-top: 7px;
      }

      .help-line {
        display: none;
      }
    }

    @media (max-height: 650px) and (max-width: 900px) {
      .brand .subtitle {
        display: none;
      }

      .caption-card {
        max-height: 44dvh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main class="app" id="app">
    <canvas id="scene" aria-label="Interactive miniature Shanghai riverfront"></canvas>

    <div class="ui" id="ui">
      <header class="brand">
        <p class="eyebrow">我的家乡 · 上海</p>
        <h1>黄浦灯火。</h1>
        <p class="subtitle">黄浦江边的一小片城市</p>
      </header>

      <div class="status-pill" aria-label="Three.js running">
        <span class="status-dot" aria-hidden="true"></span>
        <span>Three.js · 运行中</span>
      </div>

      <button class="panel-toggle" id="panel-toggle" type="button" aria-label="Open time and season controls" aria-expanded="false">☼</button>

      <aside class="side-panel" id="side-panel" aria-label="Time and season controls">
        <div class="panel-head">
          <span class="panel-kicker">TIME · SEASON</span>
          <button class="panel-close" id="panel-close" type="button" aria-label="Close controls">×</button>
        </div>

        <div class="control-block">
          <label class="control-label" for="time-slider">
            <span>LOCAL TIME</span>
            <output class="hour-readout" id="hour-readout" for="time-slider">12:00</output>
          </label>
          <input class="time-slider" id="time-slider" type="range" min="0" max="24" step="0.1" value="12" aria-label="Hour of day">
          <div class="chip-row" aria-label="Time presets">
            <button class="chip preset-button" type="button" data-hour="6.5" aria-pressed="false">清晨</button>
            <button class="chip preset-button" type="button" data-hour="12" aria-pressed="true">白天</button>
            <button class="chip preset-button" type="button" data-hour="18.5" aria-pressed="false">黄昏</button>
            <button class="chip preset-button" type="button" data-hour="20.5" aria-pressed="false">夜晚</button>
          </div>
        </div>

        <div class="control-block">
          <div class="control-label"><span>SEASON</span><span aria-hidden="true">1 — 4</span></div>
          <div class="season-row" aria-label="Season">
            <button class="season-button" type="button" data-season="spring" aria-pressed="true">春</button>
            <button class="season-button" type="button" data-season="summer" aria-pressed="false">夏</button>

      function roundedRectShape(width, height, radius) {
        const shape = new THREE.Shape();
        const x = -width / 2;
        const y = -height / 2;
        shape.moveTo(x + radius, y);
        shape.lineTo(x + width - radius, y);
        shape.quadraticCurveTo(x + width, y, x + width, y + radius);
        shape.lineTo(x + width, y + height - radius);
        shape.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        shape.lineTo(x + radius, y + height);
        shape.quadraticCurveTo(x, y + height, x, y + height - radius);
        shape.lineTo(x, y + radius);
        shape.quadraticCurveTo(x, y, x + radius, y);
        return shape;
      }

      function makeSoftShadowTexture() {
        const shadowCanvas = document.createElement("canvas");
        shadowCanvas.width = 256;
        shadowCanvas.height = 256;
        const ctx = shadowCanvas.getContext("2d");
        const gradient = ctx.createRadialGradient(128, 128, 15, 128, 128, 124);
        gradient.addColorStop(0, "rgba(35,52,53,.8)");
        gradient.addColorStop(0.48, "rgba(35,52,53,.46)");
        gradient.addColorStop(1, "rgba(35,52,53,0)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 256, 256);
        const texture = new THREE.CanvasTexture(shadowCanvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        return texture;
      }

      function riverCurve(x) {
        return 0.22 * Math.sin((x + 0.45) * 0.72) + 0.075 * Math.sin(x * 1.85 + 0.4);
      }

      function makeBankGeometry(near) {
        const cols = 40;
        const positions = [];
        const indices = [];
        for (let i = 0; i <= cols; i++) {
          const x = -4.94 + (9.88 * i / cols);
          const edge = riverCurve(x);
          const zInner = near ? edge + 1.12 : edge - 1.12;
          const zOuter = near ? 3.47 : -3.47;
          positions.push(x, 0.045, zInner, x, 0.045, zOuter);
          if (i < cols) {
            const offset = i * 2;
            if (near) {
              indices.push(offset, offset + 1, offset + 2, offset + 1, offset + 3, offset + 2);
            } else {
              indices.push(offset, offset + 2, offset + 1, offset + 1, offset + 2, offset + 3);
            }
          }
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return geometry;
      }

      function makeBankEdges() {
        const nearPoints = [];
        const farPoints = [];
        for (let i = 0; i <= 48; i++) {
          const x = -4.94 + 9.88 * i / 48;
          const z = riverCurve(x);
          nearPoints.push(new THREE.Vector3(x, 0.1, z + 1.14));
          farPoints.push(new THREE.Vector3(x, 0.1, z - 1.14));
        }
        const nearCurve = new THREE.CatmullRomCurve3(nearPoints);
        const farCurve = new THREE.CatmullRomCurve3(farPoints);
        const nearEdge = new THREE.Mesh(new THREE.TubeGeometry(nearCurve, 48, 0.045, 5, false), materials.quayNear);
        const farEdge = new THREE.Mesh(new THREE.TubeGeometry(farCurve, 48, 0.045, 5, false), materials.quayFar);
        nearEdge.receiveShadow = true;
        farEdge.receiveShadow = true;
        root.add(nearEdge, farEdge);
      }

      function makeStoneRetainingWalls() {
        const dummy = new THREE.Object3D();
        const blocks = [];
        const tones = [0x9e978d, 0xafa79b, 0x8f8a82, 0xb9b1a4];
        const addFace = (fixedAxis, side) => {
          const span = fixedAxis === "z" ? 9.2 : 6.6;
          const columns = Math.floor(span / 0.36);
          for (let row = 0; row < 4; row++) {
            for (let col = 0; col < columns; col++) {
              const along = -span / 2 + 0.18 + col * 0.36 + (row % 2) * 0.12;
              if (along > span / 2 - 0.08) continue;
              const position = new THREE.Vector3();
              if (fixedAxis === "z") {
                position.set(along, -0.57 + row * 0.145, side * 3.665);
              } else {
                position.set(side * 5.145, -0.57 + row * 0.145, along);
              }
              blocks.push({
                position,
                scale: new THREE.Vector3(
                  fixedAxis === "z" ? 0.325 : 0.055,
                  0.125,
                  fixedAxis === "z" ? 0.055 : 0.325
                ),
                color: tones[(row * 3 + col + (side > 0 ? 1 : 0)) % tones.length]
              });
            }
          }
        };
        addFace("z", 1);
        addFace("z", -1);
        addFace("x", 1);
        addFace("x", -1);

        const wall = new THREE.InstancedMesh(
          new THREE.BoxGeometry(1, 1, 1),
          materials.stone,
          blocks.length
        );
        blocks.forEach((block, index) => {
          dummy.position.copy(block.position);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.copy(block.scale);
          dummy.updateMatrix();
          wall.setMatrixAt(index, dummy.matrix);
          wall.setColorAt(index, new THREE.Color(block.color));
        });
        wall.instanceMatrix.needsUpdate = true;
        if (wall.instanceColor) wall.instanceColor.needsUpdate = true;
        wall.receiveShadow = true;
        wall.frustumCulled = false;
        root.add(wall);

        const plinth = new THREE.Mesh(new THREE.BoxGeometry(9.82, 0.075, 6.72), materials.stoneTrim);
        plinth.position.y = -0.69;
        root.add(plinth);
      }

      function makeQuayStonework() {
        const dummy = new THREE.Object3D();
        const counts = 42;
        const wall = new THREE.InstancedMesh(
          new THREE.BoxGeometry(1, 1, 1),
          materials.stone,
          counts * 2
        );
        const tones = [0xa99f91, 0xb8ad9d, 0x968e84];
        for (let side = 0; side < 2; side++) {
          for (let i = 0; i < counts; i++) {
            const x = -4.82 + (9.64 * i / (counts - 1));
            const nextX = -4.82 + (9.64 * (i + 1) / (counts - 1));
            const slope = (riverCurve(nextX) - riverCurve(x)) / Math.max(0.001, nextX - x);
            const near = side === 0;
            dummy.position.set(
              x,
              0.062,
              riverCurve(x) + (near ? 1.13 : -1.13)
            );
            dummy.rotation.set(0, -Math.atan(slope), 0);
            dummy.scale.set(0.225, 0.12, 0.07);
            dummy.updateMatrix();
            const index = side * counts + i;
            wall.setMatrixAt(index, dummy.matrix);
            wall.setColorAt(index, new THREE.Color(tones[i % tones.length]));
          }
        }
        wall.instanceMatrix.needsUpdate = true;
        if (wall.instanceColor) wall.instanceColor.needsUpdate = true;
        wall.receiveShadow = true;
        wall.frustumCulled = false;
        root.add(wall);
      }

      function makeStreetGrid() {
        const roadA = new THREE.Mesh(new THREE.BoxGeometry(8.6, 0.027, 0.13), materials.road);
        roadA.position.set(0, 0.064, -1.72);
        const roadB = new THREE.Mesh(new THREE.BoxGeometry(8.4, 0.027, 0.28), materials.road);

        const farTrees = [

        ];

          [0.5, 1.82], [1.52, 1.86], [2.53, 1.82], [3.55, 1.85], [4.55, 1.72]
        ];
        const plazaTrees = [
          [4.05, 2.12], [4.8, 2.18], [4.62, 3.08]
        ];
        const allTrees = [
          ...farTrees.map(([x, z]) => ({ x, z, scale: range(0.72, 1.03) })),
          ...nearTrees.map(([x, z]) => ({ x, z, scale: range(0.74, 1.05) })),
          ...plazaTrees.map(([x, z]) => ({ x, z, scale: range(0.68, 0.88) }))
        ];
        const count = allTrees.length;
        const foliageGeometry = new THREE.IcosahedronGeometry(1, 1);
        const foliageMaterial = new THREE.MeshToonMaterial({
          color: 0xffffff,
          gradientMap: toonGradient
        });
        const foliage = new THREE.InstancedMesh(foliageGeometry, foliageMaterial, count * 4);
        const trunks = new THREE.InstancedMesh(
          new THREE.CylinderGeometry(0.038, 0.055, 0.58, 7),
          materials.trunk,
          count
        );
        const branchCount = 5;
        const branches = new THREE.InstancedMesh(
          new THREE.CylinderGeometry(1, 1, 1, 6),
          materials.branch,
          count * branchCount
        );
        const snowCaps = new THREE.InstancedMesh(
          new THREE.IcosahedronGeometry(1, 1),
          materials.snow,
          count * branchCount
        );
        trunks.castShadow = true;
        foliage.castShadow = false;
        branches.castShadow = false;
        snowCaps.castShadow = false;
        trunks.frustumCulled = false;
        foliage.frustumCulled = false;
        branches.frustumCulled = false;
        snowCaps.frustumCulled = false;

        const dummy = new THREE.Object3D();
        const blobData = [
          [-0.13, 0.66, 0.01, 0.26],
          [0.12, 0.73, -0.025, 0.29],
          [0.02, 0.91, 0.015, 0.22],
          [-0.02, 0.61, -0.12, 0.18]
        ];
        const branchData = [
          [[0, .56, 0], [-.2, .84, .02], .018],
          [[0, .62, 0], [.18, 1.02, -.01], .018],
          [[-.09, .76, .02], [-.24, 1.02, -.02], .013],
          [[.08, .84, -.01], [.27, 1.03, .04], .013],
          [[0, .74, 0], [-.02, 1.14, .02], .014]
        ];
        const springColor = new THREE.Color(SEASONS.spring.foliage);
        const springAlt = new THREE.Color(SEASONS.spring.foliageAlt);
        let foliageIndex = 0;
        let branchIndex = 0;

        allTrees.forEach((tree, treeIndex) => {
          dummy.position.set(tree.x, 0.085 + 0.285 * tree.scale, tree.z);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.setScalar(tree.scale);
          dummy.updateMatrix();
          trunks.setMatrixAt(treeIndex, dummy.matrix);

          blobData.forEach(([bx, by, bz, radius], blobIndex) => {
            dummy.position.set(
              tree.x + bx * tree.scale,
              0.085 + by * tree.scale,
              tree.z + bz * tree.scale
            );
            dummy.rotation.set(rand() * 2, rand() * 2, rand() * 2);
            dummy.scale.setScalar(radius * tree.scale);
            dummy.updateMatrix();
            foliage.setMatrixAt(foliageIndex, dummy.matrix);
            foliage.setColorAt(foliageIndex, (treeIndex + blobIndex) % 2 ? springAlt : springColor);
            foliageIndex++;
          });

          branchData.forEach(([start, end, radius]) => {
            const from = new THREE.Vector3(
              tree.x + start[0] * tree.scale,
              0.085 + start[1] * tree.scale,
              tree.z + start[2] * tree.scale
            );
            const to = new THREE.Vector3(
              tree.x + end[0] * tree.scale,
              0.085 + end[1] * tree.scale,
              tree.z + end[2] * tree.scale
            );
            const direction = to.clone().sub(from);
            const length = direction.length();
            dummy.position.copy(from).add(to).multiplyScalar(0.5);
            dummy.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
            dummy.scale.set(radius * tree.scale, length, radius * tree.scale);
            dummy.updateMatrix();
            branches.setMatrixAt(branchIndex, dummy.matrix);

            dummy.position.copy(to);
            dummy.quaternion.identity();
            dummy.scale.set(
              radius * 1.45 * 1.8 * tree.scale,
              radius * 1.45 * 0.42 * tree.scale,
              radius * 1.45 * 1.3 * tree.scale
            );
            dummy.updateMatrix();
            snowCaps.setMatrixAt(branchIndex, dummy.matrix);
            branchIndex++;
          });
        });

        foliage.instanceMatrix.needsUpdate = true;
        if (foliage.instanceColor) foliage.instanceColor.needsUpdate = true;
        trunks.instanceMatrix.needsUpdate = true;
        branches.instanceMatrix.needsUpdate = true;
        snowCaps.instanceMatrix.needsUpdate = true;
        branches.visible = false;
        snowCaps.visible = false;
        const treeIslands = new THREE.InstancedMesh(
          new THREE.CylinderGeometry(0.18, 0.2, 0.025, 8),
          materials.lawn,
          count
        );
        allTrees.forEach((tree, index) => {
          dummy.position.set(tree.x, 0.094, tree.z);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.setScalar(tree.scale);
          dummy.updateMatrix();
          treeIslands.setMatrixAt(index, dummy.matrix);
        });
        treeIslands.instanceMatrix.needsUpdate = true;
        treeIslands.receiveShadow = true;
        root.add(treeIslands, trunks, foliage, branches, snowCaps);
        treeSystem = { trunks, foliage, branches, snowCaps, foliageMaterial };
      }

      function cylinderBetween(a, b, radius, material, radialSegments = 7) {
        const direction = new THREE.Vector3().subVectors(b, a);
        const length = direction.length();
        const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, radialSegments), material);
        mesh.position.copy(a).add(b).multiplyScalar(0.5);
        mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
        mesh.castShadow = true;
        return mesh;
      }

      function makeOrientalPearl() {
        const group = new THREE.Group();
        // proportions follow the reference model: chunky lower sphere at ~25% height,
        // ladder shaft with collars, upper sphere at ~66%, small top sphere, thin antenna
        const H = 3.47;
        // round two-step plinth
        const plinthA = new THREE.Mesh(new THREE.CylinderGeometry(0.68, 0.72, 0.1, 20), materials.stoneTrim);
        plinthA.position.y = 0.05;
        group.add(plinthA);
        const plinthB = new THREE.Mesh(new THREE.CylinderGeometry(0.56, 0.6, 0.08, 20), materials.stone);
        plinthB.position.y = 0.13;
        group.add(plinthB);

        // three splayed legs from the plinth, tangent to the lower sphere
        const legTopY = 1.35;
        const legTops = new THREE.Vector3(0.2, legTopY, 0);
        for (let i = 0; i < 3; i++) {
          const angle = i * Math.PI * 2 / 3 + Math.PI / 6;
          const foot = new THREE.Vector3(Math.cos(angle) * 0.7, 0.18, Math.sin(angle) * 0.7);
          const footVec = new THREE.Vector3(Math.cos(angle) * 0.2, legTopY, Math.sin(angle) * 0.2);
          group.add(cylinderBetween(foot, footVec, 0.075, materials.pearl, 8));
          const footPad = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.16, 0.1, 8), materials.stoneTrim);
          footPad.position.set(foot.x, 0.12, foot.z);
          group.add(footPad);
          // ring collars along each leg, like the reference's banded columns
          for (const tt of [0.35, 0.6, 0.85]) {
            const p = foot.clone().lerp(footVec, tt);
            const collar = new THREE.Mesh(new THREE.TorusGeometry(0.082, 0.014, 4, 14), materials.pearlDark);
            collar.position.copy(p);
            collar.lookAt(p.clone().add(new THREE.Vector3(0, 1, 0)));
            collar.rotateY(Math.PI / 2);
            group.add(collar);
          }
        }
        // horizontal braces between the legs
        for (let i = 0; i < 3; i++) {
          const angleA = i * Math.PI * 2 / 3 + Math.PI / 6;
          const angleB = (i + 1) * Math.PI * 2 / 3 + Math.PI / 6;
          for (const yb of [0.42, 0.72]) {
            const a = new THREE.Vector3(Math.cos(angleA) * (0.7 - 0.5 * ((yb - 0.18) / 1.17)), yb, Math.sin(angleA) * (0.7 - 0.5 * ((yb - 0.18) / 1.17)));
            const b = new THREE.Vector3(Math.cos(angleB) * (0.7 - 0.5 * ((yb - 0.18) / 1.17)), yb, Math.sin(angleB) * (0.7 - 0.5 * ((yb - 0.18) / 1.17)));
            group.add(cylinderBetween(a, b, 0.02, materials.pearlDark, 4));
          }
        }

        // hub where the three legs converge above the lower sphere
        const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.18, 0.2, 12), materials.pearl);
        hub.position.y = 1.34;
        group.add(hub);
        const collarRing = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.018, 4, 16), materials.pearlDark);
        collarRing.position.y = 1.44;
        collarRing.rotation.x = Math.PI / 2;
        group.add(collarRing);

        // grand lower sphere with observation deck ring and segmented surface
        const lowerSphere = new THREE.Mesh(new THREE.IcosahedronGeometry(0.4, 3), materials.pearlMagenta);
        lowerSphere.position.y = 0.86;
        lowerSphere.castShadow = true;
        group.add(lowerSphere);
        makePearlBands(0.86, 0.4, group);
        makePearlRibs(0.86, 0.4, group, 4);
        const lowerDeck = new THREE.Mesh(new THREE.CylinderGeometry(0.425, 0.425, 0.07, 26), materials.pearlCyan);
        lowerDeck.position.y = 0.86;
        group.add(lowerDeck);
        makePearlWindows(-0.18, 0.08, -1.58, 0.86, 0.435, 16);

        // ladder shaft: three columns with collars and small magenta spheres
        const shaftBottom = 1.3;
        const shaftTop = 2.02;
        for (let i = 0; i < 3; i++) {
          const angle = i * Math.PI * 2 / 3 + Math.PI / 2;
          const bottomP = new THREE.Vector3(Math.cos(angle) * 0.115, shaftBottom, Math.sin(angle) * 0.115);
          const topP = new THREE.Vector3(Math.cos(angle) * 0.095, shaftTop, Math.sin(angle) * 0.095);
          group.add(cylinderBetween(bottomP, topP, 0.03, materials.pearl, 8));
        }
        for (const cy of [1.5, 1.75, 2.0]) {
          const collar = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.016, 4, 18), materials.pearl);
          collar.position.y = cy;
          collar.rotation.x = Math.PI / 2;
          group.add(collar);
        }
        for (const sy of [1.62, 1.88]) {
          const small = new THREE.Mesh(new THREE.SphereGeometry(0.078, 12, 10), materials.pearlMagenta);
          small.position.y = sy;
          group.add(small);
        }

        // upper sphere
        const upperSphere = new THREE.Mesh(new THREE.IcosahedronGeometry(0.27, 3), materials.pearlMagenta);
        upperSphere.position.y = 2.28;
        upperSphere.castShadow = true;
        group.add(upperSphere);
        makePearlBands(2.28, 0.27, group);
        makePearlRibs(2.28, 0.27, group, 3);
        const upperDeck = new THREE.Mesh(new THREE.CylinderGeometry(0.29, 0.29, 0.055, 22), materials.pearlCyan);
        upperDeck.position.y = 2.28;
        group.add(upperDeck);
        makePearlWindows(-0.18, 0.08, -1.58, 2.28, 0.3, 12);

        // short mast, small top sphere, knob and antenna
        const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.07, 0.42, 8), materials.pearl);
        mast.position.y = 2.66;
        group.add(mast);
        const topSphere = new THREE.Mesh(new THREE.SphereGeometry(0.088, 12, 10), materials.pearlCyan);
        topSphere.position.y = 2.92;
        group.add(topSphere);
        const knob = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 8), materials.pearlDark);
        knob.position.y = 3.0;
        group.add(knob);
        const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.009, 0.024, 0.36, 6), materials.pearlDark);
        antenna.position.y = 3.2;
        group.add(antenna);
        const tip = new THREE.Mesh(new THREE.IcosahedronGeometry(0.03, 1), materials.crown);
        tip.position.y = 3.44;
        tip.material = materials.crown.clone();
        featureLights.push({ material: tip.material, mode: "basic", max: 1 });
        group.add(tip);

        featureLights.push({ material: materials.pearlMagenta, mode: "emissive", max: 2.4 });
        featureLights.push({ material: materials.pearlCyan, mode: "emissive", max: 1.8 });
        group.traverse((obj) => { if (obj.isMesh) obj.castShadow = true; });
        return group;
      }

      function makePearlRibs(centerY, radius, parent, count = 3) {
        for (let k = 0; k < count; k++) {
          const rib = new THREE.Mesh(
            new THREE.TorusGeometry(radius * 0.99, 0.009, 3, 26),
            materials.pearlDark
          );
          rib.position.y = centerY;
          rib.rotation.y = k * Math.PI / count;
          parent.add(rib);
        }
      }

      function makePearlWindows(originX, originY, originZ, centerY, equatorRadius, count) {
        for (let i = 0; i < count; i++) {
          const phi = (i / count) * Math.PI * 2;
          windowLitMatrices.push({
            position: new THREE.Vector3(
              originX + Math.cos(phi) * equatorRadius,
              originY + centerY,
              originZ + Math.sin(phi) * equatorRadius
            ),
            scale: new THREE.Vector3(0.045, 0.05, 1),
            quaternion: new THREE.Quaternion().setFromAxisAngle(
              new THREE.Vector3(0, 1, 0),
              Math.PI / 2 - phi
            )
          });
        }
      }

      function makePearlBands(centerY, radius, parent) {
        const offsets = [-0.56, 0, 0.56];
        for (const offset of offsets) {
          const ringRadius = Math.sqrt(Math.max(0.01, radius * radius - (offset * radius) ** 2));
          const band = new THREE.Mesh(
            new THREE.TorusGeometry(ringRadius, 0.013, 4, 18),
            materials.pearl
          );
          band.position.y = centerY + offset * radius;
          band.rotation.x = Math.PI / 2;
          parent.add(band);
        }
      }

      function makeShanghaiTower() {
        const group = new THREE.Group();
        const height = 4.55;
        const TWIST = 1.95;
        const floors = 30;
        const period = height / floors;
        const slabH = period * 0.82;
        const lobeAt = (phi) => 0.85 + 0.15 * Math.cos(3 * phi);
        // lobed superellipse cross-section like the reference's rounded floor plates
        const ringGeometry = new THREE.CylinderGeometry(1, 1, 1, 27, 1, false);
        const ringPos = ringGeometry.attributes.position;
        for (let i = 0; i < ringPos.count; i++) {
          const x = ringPos.getX(i);
          const z = ringPos.getZ(i);
          const theta = Math.atan2(z, x);
          const lobe = lobeAt(theta);
          ringPos.setX(i, x * lobe);
          ringPos.setZ(i, z * lobe);
        }
        ringGeometry.computeVertexNormals();
        // concave taper: nearly full low down, curving inward toward the crown
        const radiusAt = (t) => 0.21 + (0.53 - 0.21) * Math.pow(1 - t, 1.45);

        const dummy = new THREE.Object3D();
        const slabs = new THREE.InstancedMesh(ringGeometry, materials.glass, floors);
        const seams = new THREE.InstancedMesh(ringGeometry, materials.glassDeep, floors + 1);
        for (let f = 0; f < floors; f++) {
          const t = (f + 0.5) / floors;
          const y = -height / 2 + (f + 0.5) * period;
          const r = radiusAt(t);
          dummy.position.set(0, y, 0);
          dummy.rotation.set(0, t * TWIST, 0);
          dummy.scale.set(r, slabH, r);
          dummy.updateMatrix();
          slabs.setMatrixAt(f, dummy.matrix);
        }
        for (let f = 0; f <= floors; f++) {
          const t = f / floors;
          const y = -height / 2 + f * period;
          const r = radiusAt(clamp(t, 0, 1)) * 1.014;
          dummy.position.set(0, y, 0);
          dummy.rotation.set(0, t * TWIST, 0);
          dummy.scale.set(r, period * 0.26, r);
          dummy.updateMatrix();
          seams.setMatrixAt(f, dummy.matrix);
        }
        slabs.instanceMatrix.needsUpdate = true;
        seams.instanceMatrix.needsUpdate = true;
        slabs.castShadow = true;
        slabs.receiveShadow = true;
        group.add(slabs, seams);

        // window rows live exactly on the slab faces: same radius formula + 0.006 offset
        const towerWindowsDark = [];
        const towerWindowsLit = [];
        const windowsPerFloor = 9;
        for (let f = 0; f < floors; f++) {
          const t = (f + 0.5) / floors;
          const y = -height / 2 + (f + 0.5) * period;
          const r = radiusAt(t);
          for (let w = 0; w < windowsPerFloor; w++) {
            const phi = (w / windowsPerFloor) * Math.PI * 2 + 0.24 + t * TWIST;
            const rad = r * lobeAt(phi) + 0.006;
            const data = {
              position: new THREE.Vector3(Math.cos(phi) * rad, y, Math.sin(phi) * rad),
              scale: new THREE.Vector3(0.085, 0.052, 1),
              quaternion: new THREE.Quaternion().setFromAxisAngle(
                new THREE.Vector3(0, 1, 0),
                Math.PI / 2 - phi
              )
            };
            towerWindowsDark.push(data);
            if (rand() < 0.55) towerWindowsLit.push(data);
          }
        }
        const towerDarkMesh = new THREE.InstancedMesh(
          new THREE.PlaneGeometry(1, 1), materials.windowDark, towerWindowsDark.length
        );
        const towerLitMesh = new THREE.InstancedMesh(
          new THREE.PlaneGeometry(1, 1), materials.windowLit, towerWindowsLit.length
        );
        fillInstanceMatrices(towerDarkMesh, towerWindowsDark);
        fillInstanceMatrices(towerLitMesh, towerWindowsLit);
        tintLitWindows(towerLitMesh, towerWindowsLit.length);
        towerDarkMesh.frustumCulled = false;
        towerLitMesh.frustumCulled = false;
        group.add(towerDarkMesh, towerLitMesh);

        // simple tapered parapet crown, no antenna — like the reference
        const crownCap = new THREE.Mesh(
          new THREE.CylinderGeometry(0.13, 0.235, 0.36, 18),
          materials.glassLight
        );
        crownCap.position.y = height / 2 + 0.14;
        crownCap.castShadow = true;
        group.add(crownCap);
        const parapet = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.022, 5, 22), materials.glassDeep);
        parapet.position.y = height / 2 + 0.02;
        parapet.rotation.x = Math.PI / 2;
        group.add(parapet);
        const crownRing = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.02, 5, 20), materials.crown);
        crownRing.position.y = height / 2 + 0.33;
        crownRing.rotation.x = Math.PI / 2;
        crownRing.material = materials.crown.clone();
        featureLights.push({ material: crownRing.material, mode: "basic", max: 1.35 });
        group.add(crownRing);

        const podium = new THREE.Mesh(new THREE.CylinderGeometry(0.76, 0.86, 0.3, 24), materials.glassDeep);
        podium.position.y = -height / 2 + 0.15;
        podium.castShadow = true;
        group.add(podium);

        featureLights.push({ material: materials.glass, mode: "emissive", max: 0.5 });
        return group;
      }

      function makeWFC() {
        const group = new THREE.Group();
        const bottom = -1.8;
        const bodyTop = 1.3;
        const capBottom = 1.78;
        const capTop = 1.92;
        const width = 0.92;
        const depthAt = (t) => lerp(0.56, 0.34, t);
        const fullT = (y) => clamp((y - bottom) / (capTop - bottom), 0, 1);

        // chamfered rectangle footprint extruded to unit height along +y
        const ch = 0.07;
        const shape = new THREE.Shape();
        shape.moveTo(-width / 2 + ch, -0.28);
        shape.lineTo(width / 2 - ch, -0.28);
        shape.lineTo(width / 2, -0.28 + ch);
        shape.lineTo(width / 2, 0.28 - ch);
        shape.lineTo(width / 2 - ch, 0.28);
        shape.lineTo(-width / 2 + ch, 0.28);
        shape.lineTo(-width / 2, 0.28 - ch);
        shape.lineTo(-width / 2, -0.28 + ch);
        shape.closePath();
        const slabGeometry = new THREE.ExtrudeGeometry(shape, {
          depth: 1,
          bevelEnabled: false,
          curveSegments: 1
        });
        slabGeometry.rotateX(-Math.PI / 2);
        slabGeometry.computeVertexNormals();

        // stacked body slabs with dark seams — banded floor rhythm like the reference
        const floors = 26;
        const period = (bodyTop - bottom) / floors;
        const slabH = period * 0.8;
        const dummy = new THREE.Object3D();
        const slabs = new THREE.InstancedMesh(slabGeometry, materials.swfc, floors);
        for (let f = 0; f < floors; f++) {
          const y = bottom + (f + 0.5) * period;
          dummy.position.set(0, y, 0);
          dummy.scale.set(1, slabH, depthAt(fullT(y)) / 0.56);
          dummy.updateMatrix();
          slabs.setMatrixAt(f, dummy.matrix);
        }
        const seams = new THREE.InstancedMesh(slabGeometry, materials.swfcDark, floors + 1);
        for (let f = 0; f <= floors; f++) {
          const y = bottom + f * period;
          dummy.position.set(0, y, 0);
          dummy.scale.set(1.012, period * 0.28, depthAt(fullT(y)) / 0.56 * 1.012);
          dummy.updateMatrix();
          seams.setMatrixAt(f, dummy.matrix);
        }
        slabs.instanceMatrix.needsUpdate = true;
        seams.instanceMatrix.needsUpdate = true;
        slabs.castShadow = true;
        slabs.receiveShadow = true;
        group.add(slabs, seams);

        // aperture zone: two leg stacks, the trapezoid hole between them (wider at top)
        const legFloors = 6;
        const legPeriod = (capBottom - bodyTop) / legFloors;
        const legH = legPeriod * 0.8;
        const innerAt = (tt) => lerp(0.13, 0.21, tt);
        const legs = new THREE.InstancedMesh(slabGeometry, materials.swfc, legFloors * 2);
        for (let f = 0; f < legFloors; f++) {
          const y = bodyTop + (f + 0.5) * legPeriod;
          const inner = innerAt((f + 0.5) / legFloors);
          const legW = width / 2 - inner;
          const ds = depthAt(fullT(y)) / 0.56;
          for (const side of [-1, 1]) {
            dummy.position.set(side * (width / 2 - legW / 2), y, 0);
            dummy.scale.set(legW / width, legH, ds);
            dummy.updateMatrix();
            legs.setMatrixAt(f * 2 + (side > 0 ? 1 : 0), dummy.matrix);
          }
        }
        legs.instanceMatrix.needsUpdate = true;
        legs.castShadow = true;
        group.add(legs);

        // bridge cap over the hole
        const cap = new THREE.Mesh(slabGeometry, materials.swfc);
        cap.scale.set(1, capTop - capBottom, depthAt(1) / 0.56);
        cap.position.y = (capBottom + capTop) / 2;
        cap.castShadow = true;
        group.add(cap);

        // corner mullion columns following the depth taper
        const wfcCorners = [
          { xb: -0.45, z: 0.27 }, { xb: -0.45, z: -0.27 },
          { xb: 0.45, z: 0.27 }, { xb: 0.45, z: -0.27 }
        ];
        for (const corner of wfcCorners) {
          group.add(cylinderBetween(
            new THREE.Vector3(corner.xb, bottom + 0.02, corner.z * (depthAt(0) / 0.56)),
            new THREE.Vector3(corner.xb, capTop - 0.03, corner.z * (depthAt(1) / 0.56)),
            0.02, materials.glassLight, 4
          ));
        }

        // window rows flush on the slab faces (same depth formula + 0.005)
        const darkWindows = [];
        const litWindows = [];
        for (let f = 0; f < floors; f++) {
          const y = bottom + (f + 0.5) * period;
          const halfDepth = depthAt(fullT(y)) / 2 + 0.005;
          for (const face of [-1, 1]) {
            const q = new THREE.Quaternion();
            if (face < 0) q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI);
            for (const xLocal of [-0.33, -0.17, 0, 0.17, 0.33]) {
              const data = {
                position: new THREE.Vector3(xLocal, y, face * halfDepth),
                scale: new THREE.Vector3(0.08, 0.055, 1),
                quaternion: q
              };
              darkWindows.push(data);
              if (rand() < 0.6) litWindows.push(data);
            }
          }
          for (const sideX of [-1, 1]) {
            const sideQ = new THREE.Quaternion().setFromAxisAngle(
              new THREE.Vector3(0, 1, 0),
              sideX * Math.PI / 2
            );
            for (const zc of [-0.09, 0.09]) {
              const data = {
                position: new THREE.Vector3(sideX * (width / 2 + 0.005), y, zc * (depthAt(fullT(y)) / 0.56)),
                scale: new THREE.Vector3(0.06, 0.055, 1),
                quaternion: sideQ.clone()
              };
              darkWindows.push(data);
              if (rand() < 0.5) litWindows.push(data);
            }
          }
        }
        for (let f = 0; f < legFloors; f++) {
          const y = bodyTop + (f + 0.5) * legPeriod;
          const inner = innerAt((f + 0.5) / legFloors);
          const halfDepth = depthAt(fullT(y)) / 2 + 0.005;
          const legW = width / 2 - inner;
          for (const face of [-1, 1]) {
            const q = new THREE.Quaternion();
            if (face < 0) q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI);
            for (const side of [-1, 1]) {
              const legCenter = side * (width / 2 - legW / 2);
              for (const dx of [-legW * 0.3, 0, legW * 0.3]) {
                const data = {
                  position: new THREE.Vector3(legCenter + dx, y, face * halfDepth),
                  scale: new THREE.Vector3(0.05, 0.05, 1),
                  quaternion: q
                };
                darkWindows.push(data);
                if (rand() < 0.55) litWindows.push(data);
              }
            }
          }
        }
        const darkWindowMesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), materials.windowDark, darkWindows.length);
        const litWindowMesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), materials.windowLit, litWindows.length);
        fillInstanceMatrices(darkWindowMesh, darkWindows);
        fillInstanceMatrices(litWindowMesh, litWindows);
        tintLitWindows(litWindowMesh, litWindows.length);
        darkWindowMesh.frustumCulled = false;
        litWindowMesh.frustumCulled = false;
        group.add(darkWindowMesh, litWindowMesh);

        // glowing aperture outline hugging the trapezoid hole exactly
        const apertureFrameShape = new THREE.Shape();
        apertureFrameShape.moveTo(-0.21, 1.34);
        apertureFrameShape.lineTo(0.21, 1.34);
        apertureFrameShape.lineTo(0.29, 1.78);
        apertureFrameShape.lineTo(-0.29, 1.78);
        apertureFrameShape.closePath();
        const apertureHole = new THREE.Path();
        apertureHole.moveTo(-0.13, 1.33);
        apertureHole.lineTo(0.13, 1.33);
        apertureHole.lineTo(0.21, 1.79);
        apertureHole.lineTo(-0.21, 1.79);
        apertureHole.closePath();
        apertureFrameShape.holes.push(apertureHole);
        const apertureFrameGeometry = new THREE.ShapeGeometry(apertureFrameShape, 1);
        const feature = new THREE.Group();
        for (const side of [-1, 1]) {
          const frame = new THREE.Mesh(apertureFrameGeometry, materials.aperture);
          frame.position.z = side * (depthAt(0.9) / 2 + 0.006);
          feature.add(frame);
        }
        const crown = new THREE.Mesh(new THREE.BoxGeometry(0.78, 0.03, depthAt(1) + 0.05), materials.crown);
        crown.position.y = capTop;
        feature.add(crown);
        group.add(feature);
        featureLights.push({ material: materials.aperture, mode: "basic", max: 1.1 });
        featureLights.push({ material: materials.crown, mode: "basic", max: 0.85 });
        featureLights.push({ material: materials.swfc, mode: "emissive", max: 0.55 });
        return group;
      }

      function makeJinMao() {
        const group = new THREE.Group();
        const jinDark = [];
        const jinLit = [];
        // art-deco stone tower: banded tiers, ledges, gourd-tipped spire — like the reference
        const lowerPodium = new THREE.Mesh(
          new THREE.BoxGeometry(1.04, 0.22, 0.9),
          materials.stoneTrim
        );
        lowerPodium.position.y = 0.13;
        lowerPodium.castShadow = true;
        group.add(lowerPodium);
        const upperPodium = new THREE.Mesh(
          new THREE.BoxGeometry(0.88, 0.14, 0.78),
          materials.jinmaoLight
        );
        upperPodium.position.y = 0.3;
        upperPodium.castShadow = true;
        group.add(upperPodium);

        const tiers = [
          { bottom: 0.37, top: 1.3, width: 0.8, depth: 0.7, slabs: 7 },
          { bottom: 1.3, top: 1.86, width: 0.66, depth: 0.58, slabs: 4 },
          { bottom: 1.86, top: 2.26, width: 0.54, depth: 0.47, slabs: 3 },
          { bottom: 2.26, top: 2.55, width: 0.43, depth: 0.37, slabs: 2 },
          { bottom: 2.55, top: 2.78, width: 0.33, depth: 0.29, slabs: 2 }
        ];
        for (let i = 0; i < tiers.length; i++) {
          const tier = tiers[i];
          const period = (tier.top - tier.bottom) / tier.slabs;
          const slabH = period * 0.8;
          for (let s = 0; s < tier.slabs; s++) {
            const y = tier.bottom + (s + 0.5) * period;
            const slab = new THREE.Mesh(
              new THREE.BoxGeometry(tier.width, slabH, tier.depth),
              materials.jinmaoLight
            );
            slab.position.y = y;
            slab.castShadow = true;
            slab.receiveShadow = true;
            group.add(slab);
            const seam = new THREE.Mesh(
              new THREE.BoxGeometry(tier.width + 0.014, period * 0.3, tier.depth + 0.014),
              materials.jinmaoDark
            );
            seam.position.y = tier.bottom + s * period;
            group.add(seam);
            // window slits flush on the slab faces (LOCAL coords, instanced inside the group)
            for (const face of [-1, 1]) {
              const q = new THREE.Quaternion();
              if (face < 0) q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI);
              for (const cx of [-0.22, 0, 0.22]) {
                const data = {
                  position: new THREE.Vector3(
                    cx * tier.width,
                    y,
                    face * (tier.depth / 2 + 0.005)
                  ),
                  scale: new THREE.Vector3(0.052, slabH * 0.62, 1),
                  quaternion: q
                };
                jinDark.push(data);
                if (rand() < 0.55) jinLit.push(data);
              }
              const sideQ = new THREE.Quaternion().setFromAxisAngle(
                new THREE.Vector3(0, 1, 0),
                face * Math.PI / 2
              );
              for (const cz of [-0.2, 0.2]) {
                const data = {
                  position: new THREE.Vector3(
                    face * (tier.width / 2 + 0.005),
                    y,
                    cz * tier.depth
                  ),
                  scale: new THREE.Vector3(0.048, slabH * 0.62, 1),
                  quaternion: sideQ.clone()
                };
                jinDark.push(data);
                if (rand() < 0.5) jinLit.push(data);
              }
            }
          }
          // ledge cap over each tier
          const ledge = new THREE.Mesh(
            new THREE.BoxGeometry(tier.width + 0.1, 0.035, tier.depth + 0.1),
            materials.jinmaoDark
          );
          ledge.position.y = tier.top;
          group.add(ledge);
          // corner fins
          for (const sx of [-1, 1]) {
            for (const sz of [-1, 1]) {
              const fin = new THREE.Mesh(
                new THREE.BoxGeometry(0.032, tier.top - tier.bottom + 0.04, 0.032),
                materials.pearl
              );
              fin.position.set(
                sx * tier.width * 0.5,
                (tier.top + tier.bottom) / 2,
                sz * tier.depth * 0.5
              );
              group.add(fin);
            }
          }
          if (i === 1 || i === 3) {
            const accent = new THREE.Mesh(
              new THREE.BoxGeometry(tier.width + 0.14, 0.014, tier.depth + 0.14),
              materials.crown
            );
            accent.position.y = tier.top + 0.02;
            accent.material = materials.crown.clone();
            featureLights.push({ material: accent.material, mode: "basic", max: 0.7 });
            group.add(accent);
          }
        }

        // stepped crown with corner spikes
        const crownLevels = [
          { y: 2.84, width: 0.3, depth: 0.27, height: 0.1 },
          { y: 2.95, width: 0.24, depth: 0.21, height: 0.09 },
          { y: 3.05, width: 0.18, depth: 0.16, height: 0.08 }
        ];
        for (let i = 0; i < crownLevels.length; i++) {
          const level = crownLevels[i];
          const block = new THREE.Mesh(
            new THREE.BoxGeometry(level.width, level.height, level.depth),
            i % 2 ? materials.pearl : materials.jinmaoLight
          );
          block.position.y = level.y;
          group.add(block);
          for (const sx of [-1, 1]) {
            for (const sz of [-1, 1]) {
              const spike = new THREE.Mesh(
                new THREE.ConeGeometry(0.02, 0.1, 4),
                materials.glassLight
              );
              spike.position.set(
                sx * level.width * 0.42,
                level.y + level.height * 0.5 + 0.05,
                sz * level.depth * 0.42
              );
              group.add(spike);
            }
          }
        }

        // gourd-tipped spire — the reference tower's signature finial
        const spire = new THREE.Mesh(
          new THREE.CylinderGeometry(0.012, 0.04, 0.2, 6),
          materials.pearl
        );
        spire.position.y = 3.09;
        group.add(spire);
        const gourdLower = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8), materials.pearlMagenta);
        gourdLower.position.y = 3.17;
        group.add(gourdLower);
        const gourdUpper = new THREE.Mesh(new THREE.SphereGeometry(0.034, 10, 8), materials.pearlMagenta);
        gourdUpper.position.y = 3.23;
        group.add(gourdUpper);
        const tip = new THREE.Mesh(new THREE.IcosahedronGeometry(0.026, 1), materials.crown);
        tip.position.y = 3.28;
        tip.material = materials.crown.clone();
        featureLights.push({ material: tip.material, mode: "basic", max: 0.9 });
        group.add(tip);

        const jinDarkMesh = new THREE.InstancedMesh(
          new THREE.PlaneGeometry(1, 1), materials.windowDark, jinDark.length
        );
        const jinLitMesh = new THREE.InstancedMesh(
          new THREE.PlaneGeometry(1, 1), materials.windowLit, jinLit.length
        );
        fillInstanceMatrices(jinDarkMesh, jinDark);
        fillInstanceMatrices(jinLitMesh, jinLit);
        tintLitWindows(jinLitMesh, jinLit.length);
        jinDarkMesh.frustumCulled = false;
        jinLitMesh.frustumCulled = false;
        group.add(jinDarkMesh, jinLitMesh);
        return group;
      }

      function makeMidrise(width, height, x, z, index) {
        const group = new THREE.Group();

      function createWake() {
        const count = 34;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        const points = new THREE.Points(geometry, materials.wake.clone());
        for (let i = 0; i < count; i++) positions[i * 3 + 1] = -1;
        geometry.attributes.position.needsUpdate = true;
        points.position.set(-0.62, -0.03, 0);
        points.frustumCulled = false;
        points.userData.wake = true;
        points.userData.age = 0;
        points.userData.next = 0;
        return points;
      }
